<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important} body{margin:0} img{max-width:100%}</style>
<title>A Day Online</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: landing = hero + five age-group cards. Game = timeline strip, mock screen left, coaching panel right (stacked on phones). */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f6f8fa; --ink:#16212a; --muted:#5a6773; --line:#d4dbe2;
  --accent:#1d5c74; --accent-ink:#ffffff;
  --flag:#c4441d; --flag-soft:#fbe4da; --ok:#2c7a4c; --ok-soft:#dcefe3; --mark:#d99a0b; --mark-soft:#fdf0c6;
  --bubble:#e7ebef; --alarm:#b3261e; --alarm-ink:#ffffff;
  --c-kids:#b5541a; --c-teens:#6a3fb5; --c-young:#1b6f69; --c-thirties:#5b6b12; --c-adults:#1d5c74; --c-seniors:#8a3b5a;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f161b; --surface:#172129; --surface-2:#1d2932; --ink:#e5ebf0; --muted:#94a3ae; --line:#2b3842;
  --accent:#6bb4d0; --accent-ink:#0b1a21;
  --flag:#ff7f57; --flag-soft:#3b2219; --ok:#6fcb95; --ok-soft:#1b3426; --mark:#f2c14e; --mark-soft:#3a3115;
  --bubble:#25323c; --alarm:#c2382f; --alarm-ink:#ffffff;
  --c-kids:#f0a36b; --c-teens:#b79af0; --c-young:#6cc9c1; --c-thirties:#bcd36a; --c-adults:#6bb4d0; --c-seniors:#e59ab8; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f161b; --surface:#172129; --surface-2:#1d2932; --ink:#e5ebf0; --muted:#94a3ae; --line:#2b3842;
  --accent:#6bb4d0; --accent-ink:#0b1a21;
  --flag:#ff7f57; --flag-soft:#3b2219; --ok:#6fcb95; --ok-soft:#1b3426; --mark:#f2c14e; --mark-soft:#3a3115;
  --bubble:#25323c; --alarm:#c2382f; --alarm-ink:#ffffff;
  --c-kids:#f0a36b; --c-teens:#b79af0; --c-young:#6cc9c1; --c-thirties:#bcd36a; --c-adults:#6bb4d0; --c-seniors:#e59ab8; color-scheme:dark }
:root, .wrap{--accent-soft:color-mix(in srgb, var(--accent) 14%, var(--surface))}

body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.5}
.wrap{max-width:1120px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:20px 48px}
.wrap.g-kids{font-size:17px}
h1,h2,h3{font-family:var(--display); text-wrap:balance; margin:0; line-height:1.15}
button{font:inherit; cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}

.top{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink)}
.brand-mark{width:30px; height:30px; border-radius:50%; background:conic-gradient(var(--flag) 0 25%, var(--accent) 0 100%); position:relative}
.brand-mark::after{content:""; position:absolute; inset:7px; border-radius:50%; background:var(--bg)}
.brand h1{font-size:1.35rem; font-weight:800; letter-spacing:-.01em}
.topright{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.score-pill{font-family:var(--mono); font-size:.85rem; background:var(--surface); border:1px solid var(--line); padding:4px 10px; border-radius:999px; font-variant-numeric:tabular-nums}
.back{font-size:.92rem; text-decoration:none; font-weight:600}

.timeline{display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:20px; scrollbar-width:thin}
.tchip{flex:0 0 auto; font-family:var(--mono); font-size:.78rem; padding:5px 9px; border-radius:6px; background:var(--surface); border:1px solid var(--line); color:var(--muted); font-variant-numeric:tabular-nums}
.tchip.now{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.tchip.right{border-color:var(--ok); color:var(--ok)}
.tchip.wrong{border-color:var(--flag); color:var(--flag)}

/* Landing */
.hero{display:grid; gap:14px; margin:12px 0 28px; max-width:780px}
.hero h2{font-size:clamp(2.1rem, 5.5vw, 3.6rem); font-weight:800; letter-spacing:-.02em}
.hero h2 em{font-style:normal; color:var(--flag)}
.lede{font-size:1.12rem; color:var(--muted); max-width:62ch; margin:0}
.how{display:flex; flex-wrap:wrap; gap:8px 22px; font-size:.95rem; color:var(--muted); margin:0; padding:0; list-style:none}
.how b{color:var(--ink)}
.groups{display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap:16px}
.gcard{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px; display:grid; gap:10px; align-content:start; text-decoration:none; color:var(--ink); transition:border-color .15s, transform .15s}
.gcard:hover{border-color:var(--gc); transform:translateY(-2px)}
.gcard .ages{font-family:var(--display); font-weight:800; font-size:2.4rem; line-height:1; color:var(--gc); font-variant-numeric:tabular-nums}
.gcard h3{font-size:1.3rem}
.gcard .people{font-size:.92rem; color:var(--muted)}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{font-size:.8rem; border:1px solid var(--line); border-radius:999px; padding:2px 9px; color:var(--muted)}
.gcard .go{font-weight:700; color:var(--gc); margin-top:4px}
.note{margin-top:28px; color:var(--muted); font-size:.95rem; max-width:70ch}

/* Group intro */
.intro{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:28px; align-items:start}
.intro h2{font-size:clamp(1.9rem, 4.6vw, 3rem); font-weight:800; letter-spacing:-.02em}
.intro .lede{margin:14px 0 20px}
.steps{display:grid; gap:10px; margin:0 0 24px; padding:0; list-style:none; counter-reset:s}
.steps li{display:flex; gap:12px; align-items:baseline; counter-increment:s}
.steps li::before{content:counter(s); font-family:var(--mono); font-size:.8rem; font-weight:600; color:var(--accent); border:1.5px solid var(--accent); border-radius:50%; width:24px; height:24px; display:inline-grid; place-items:center; flex:0 0 auto}
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px}
.personas{display:grid; gap:14px}
.persona-head{display:flex; gap:14px; align-items:center}
.persona-av{width:48px; height:48px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; font-family:var(--display); font-weight:800; font-size:1.1rem; flex:0 0 auto}
.persona-head h3{font-size:1.1rem}
.persona-head p{margin:0; color:var(--muted); font-size:.93rem}
.btn{border:0; border-radius:10px; padding:12px 18px; font-weight:700; background:var(--accent); color:var(--accent-ink); text-decoration:none; display:inline-block}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--line)}
.btn.scam{background:var(--flag); color:#fff}
.btn.safe{background:var(--ok); color:#fff}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn.scam, :root:not([data-theme="light"]) .btn.safe{color:#10181d}}
:root[data-theme="dark"] .btn.scam, :root[data-theme="dark"] .btn.safe{color:#10181d}

/* Play */
.play{display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:24px; align-items:start}
.stage-meta{display:flex; gap:10px; align-items:baseline; margin-bottom:10px; flex-wrap:wrap}
.clock{font-family:var(--display); font-weight:800; font-size:2rem; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.place{color:var(--muted)}
.who{font-size:.8rem; font-weight:700; background:var(--accent-soft); color:var(--accent); border-radius:999px; padding:2px 10px}
.panel.card.good{border-color:var(--ok)}
.panel{position:sticky; top:calc(env(safe-area-inset-top, 0px) + 12px); display:grid; gap:14px}
.context{font-size:1.05rem; margin:0}
.hint{color:var(--muted); font-size:.95rem; margin:0}
.marked-count{font-family:var(--mono); font-size:.82rem; color:var(--mark)}
.actions{display:flex; gap:10px; flex-wrap:wrap}
.actions .btn{flex:1 1 140px; text-align:center}
.verdict{display:flex; gap:10px; align-items:center; font-family:var(--display); font-weight:800; font-size:1.3rem}
.verdict .dot{width:12px; height:12px; border-radius:50%; flex:0 0 auto}
.verdict.right .dot{background:var(--ok)} .verdict.wrong .dot{background:var(--flag)}
.goodjob{background:var(--ok-soft); border:2px solid var(--ok); border-radius:10px; padding:12px 14px; display:grid; gap:4px}
.goodjob .verdict{color:var(--ok)}
.gj-badge{justify-self:start; background:var(--ok); color:var(--surface); font-weight:800; font-size:.85rem; padding:3px 10px; border-radius:999px}
.gj-note{margin:2px 0 0; font-size:.92rem; color:var(--ink)}
.scamname{font-family:var(--mono); font-size:.78rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted)}
.flaglist{list-style:none; margin:0; padding:0; display:grid; gap:10px}
.flaglist li{display:grid; grid-template-columns:26px minmax(0,1fr); gap:10px; align-items:start}
.num{font-family:var(--mono); font-size:.75rem; font-weight:600; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; background:var(--flag); color:#fff}
.num.ok{background:var(--ok)}
.flaglist b{display:block}
.flaglist .st{font-family:var(--mono); font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; margin-left:6px}
.st.found{color:var(--ok)} .st.missed{color:var(--flag)}
.flaglist p{margin:2px 0 0; color:var(--muted); font-size:.95rem}
.lesson{background:var(--accent-soft); border-radius:10px; padding:12px 14px}
.lesson b{font-family:var(--mono); font-size:.75rem; text-transform:uppercase; letter-spacing:.08em; color:var(--accent); display:block; margin-bottom:2px}
.falsenote{font-size:.9rem; color:var(--muted); margin:0}

/* Hotspots */
.hot{cursor:pointer; border-radius:4px; transition:background .15s, box-shadow .15s; position:relative}
.spot .hot:hover{background:var(--mark-soft)}
.hot.marked{background:var(--mark-soft); box-shadow:0 0 0 2px var(--mark)}
.spot .hot.btnlink:hover, .hot.btnlink.marked{background:var(--accent); color:var(--accent-ink)}
.spot .hot.ghostlink:hover, .hot.ghostlink.marked{background:transparent; color:var(--ink)}
.reveal .hot{cursor:default}
.reveal .hot.marked{background:transparent; box-shadow:none}
.reveal .hot.is-flag{box-shadow:0 0 0 2px var(--ok); background:var(--ok-soft)}
.reveal .hot.is-flag[data-n]::after{background:var(--ok)}
.reveal .hot.is-flag.missed{font-weight:800; background:var(--flag-soft); box-shadow:0 0 0 3px var(--flag); outline:3px dashed var(--flag); outline-offset:4px; animation:pulse 1.4s ease-in-out 3}
.reveal .hot.is-flag.missed[data-n]::after{background:var(--flag); width:22px; height:22px; line-height:22px; font-size:12px; top:-13px; right:-13px}
.reveal .hot.is-flag.missed::before{content:"MISSED"; position:absolute; left:-4px; top:-22px; background:var(--flag); color:#fff; font:700 10px/1 var(--mono); letter-spacing:.08em; padding:3px 5px; border-radius:3px; z-index:3; white-space:nowrap}
@keyframes pulse{50%{outline-offset:8px}}
.legend{display:flex; flex-wrap:wrap; gap:6px 16px; font-size:.85rem; color:var(--muted); margin:14px 0 0}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{width:14px; height:14px; border-radius:3px; display:inline-block}
.legend .lg-miss{background:var(--flag-soft); box-shadow:0 0 0 2px var(--flag)}
.legend .lg-got{background:var(--ok-soft); box-shadow:0 0 0 2px var(--ok)}
.legend .lg-false{background:var(--surface-2); box-shadow:0 0 0 1px var(--line)}
.flaglist li.missed-row{background:var(--flag-soft); border-radius:8px; padding:8px; margin:-4px -8px; box-shadow:inset 3px 0 0 var(--flag)}
.flaglist li.missed-row b{color:var(--flag)}
.flaglist li.missed-row p{color:var(--ink)}
.num.got{background:var(--ok)}
.st.missed{font-weight:800; font-size:.78rem}
.missbox{background:var(--flag-soft); border-radius:10px; padding:10px 14px; font-weight:700; color:var(--flag)}
/* Report + results log */
.namefield{display:grid; gap:4px; margin:0 0 18px; max-width:340px; font-size:.9rem; color:var(--muted)}
.namefield input, .toolbar select{font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:9px 12px}
.report-table{width:100%; border-collapse:collapse; font-size:.92rem}
.report-table th{text-align:left; font-family:var(--mono); font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap}
.report-table td{padding:10px; border-bottom:1px solid var(--line); vertical-align:top}
.report-table td.num-c{font-variant-numeric:tabular-nums; white-space:nowrap}
.report-table .miss{color:var(--flag); font-weight:700}
.report-table .good{color:var(--ok); font-weight:700}
.report-table tr.click{cursor:pointer} .report-table tr.click:hover td{background:var(--surface-2)}
.tablewrap{overflow-x:auto}
.toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between}
.savenote{font-size:.88rem; color:var(--muted); margin:0}
.savenote.ok{color:var(--ok)} .savenote.bad{color:var(--flag)}
.tiles{display:flex; flex-wrap:wrap; gap:22px}
.tiles div{font-size:.9rem; color:var(--muted)}
.tiles b{display:block; font-family:var(--display); font-size:1.6rem; color:var(--ink); font-variant-numeric:tabular-nums}
.detail td{background:var(--surface-2)}
.detail ul{margin:6px 0 0; padding-left:18px}
.resultsLink{font-size:.92rem; font-weight:600; text-decoration:none}
#hoverTip{position:fixed; z-index:50; pointer-events:none; background:var(--ink); color:var(--bg); font:600 .8rem/1.2 var(--body); padding:7px 10px; border-radius:6px; white-space:nowrap; box-shadow:0 6px 18px -6px rgba(0,0,0,.45); opacity:0; transform:translateY(4px); transition:opacity .12s}
#hoverTip.show{opacity:1; transform:none}
@media (hover:none){ #hoverTip{display:none} }
.fields{display:flex; flex-wrap:wrap; gap:0 14px}
.fields .namefield{flex:1 1 200px}
.namefield input[readonly]{background:var(--surface-2)}
.welcome{display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:8px; border-color:var(--accent)}
.reveal .hot.is-ok{box-shadow:0 0 0 2px var(--ok); background:var(--ok-soft)}
.reveal .hot.is-false{text-decoration:line-through; text-decoration-color:var(--muted); background:var(--surface-2)}
.reveal .hot[data-n]::after{content:attr(data-n); position:absolute; top:-10px; right:-10px; width:18px; height:18px; border-radius:50%; background:var(--flag); color:#fff; font:600 11px/18px var(--mono); text-align:center; z-index:2}
.reveal .hot.is-ok[data-n]::after{background:var(--ok)}
.reveal .banner[data-n]::after{top:8px; right:10px}
.alarm .hot.is-flag, .post-card .hot.is-flag{background:transparent; box-shadow:0 0 0 2px #fff}
.alarm .hot.is-flag.missed{outline-color:#fff}

/* Mock: phone */
.phone{max-width:360px; margin:0 auto; background:var(--surface); border:10px solid var(--ink); border-radius:34px; overflow:hidden; box-shadow:0 18px 40px -20px rgba(10,20,30,.45)}
.phone-bar{display:flex; justify-content:space-between; padding:8px 18px 4px; font:600 .78rem var(--mono); color:var(--ink)}
.sms-head{display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 14px 12px; border-bottom:1px solid var(--line); text-align:center}
.avatar{width:44px; height:44px; border-radius:50%; background:var(--bubble); display:grid; place-items:center; font-weight:700; color:var(--muted); flex:0 0 auto; font-size:.85rem}
.sms-name{font-weight:700; font-size:.95rem}
.sms-sub{font-size:.75rem; color:var(--muted)}
.call-head{padding:22px 14px 16px; text-align:center; display:grid; gap:6px; justify-items:center; border-bottom:1px solid var(--line)}
.call-head .avatar{width:64px; height:64px; font-size:1.2rem}
.call-btns{display:flex; justify-content:center; gap:40px; padding:4px 0 18px}
.call-btns i{width:46px; height:46px; border-radius:50%; display:block}
.call-btns i:first-child{background:var(--flag)} .call-btns i:last-child{background:var(--ok)}
.sms-body{padding:16px 14px 22px; display:grid; gap:8px; min-height:240px; align-content:start}
.bubble{background:var(--bubble); border-radius:18px 18px 18px 6px; padding:10px 13px; max-width:88%; font-size:.95rem; overflow-wrap:anywhere}
.bubble.me{justify-self:end; background:var(--accent-soft); border-radius:18px 18px 6px 18px}
.spk{display:block; font-size:.72rem; font-family:var(--mono); color:var(--muted); text-transform:uppercase; letter-spacing:.05em}
.url{font-family:var(--mono); font-size:.85em; color:var(--accent); text-decoration:underline; overflow-wrap:anywhere}

/* Mock: windows */
.win{background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden; box-shadow:0 18px 40px -24px rgba(10,20,30,.45)}
.win-bar{display:flex; align-items:center; gap:8px; padding:9px 12px; background:var(--surface-2); border-bottom:1px solid var(--line); font-size:.82rem; color:var(--muted); min-width:0}
.lights{display:flex; gap:5px; flex:0 0 auto} .lights i{width:10px; height:10px; border-radius:50%; background:var(--line); display:block}
.addr{flex:1; min-width:0; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:4px 12px; font-family:var(--mono); font-size:.8rem; color:var(--ink); overflow-wrap:anywhere}
.banner{display:block; background:var(--mark-soft); color:var(--ink); padding:8px 16px; font-size:.85rem; border-bottom:1px solid var(--line)}
.mail-head{padding:14px 18px; border-bottom:1px solid var(--line); display:grid; gap:4px; font-size:.92rem; overflow-wrap:anywhere}
.mail-head .subj{font-family:var(--display); font-weight:700; font-size:1.2rem; margin-bottom:4px}
.mail-head .lbl{color:var(--muted); display:inline-block; width:44px}
.mail-body{padding:18px; font-size:.97rem; overflow-wrap:anywhere}
.btnlink{display:inline-block; background:var(--accent); color:var(--accent-ink); padding:8px 16px; border-radius:6px; font-weight:700}
.ghostlink{background:transparent; color:var(--ink); border:1.5px solid var(--line)}
.hoverurl{display:block; margin-top:8px; font-size:.8rem; color:var(--muted)}
.chat-head{display:flex; gap:10px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); font-size:.92rem; flex-wrap:wrap}
.ext{font-family:var(--mono); font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; background:var(--mark-soft); color:var(--ink); padding:1px 6px; border-radius:4px}
.ext.ok{background:var(--ok-soft); color:var(--ok)}
.chat-body{padding:16px; display:grid; gap:12px; min-height:240px; align-content:start}
.msg{display:grid; grid-template-columns:34px minmax(0,1fr); gap:10px}
.msg .avatar{width:34px; height:34px; font-size:.75rem}
.msg .whoname{font-size:.8rem; color:var(--muted); font-weight:700}
.msg.me .avatar{background:var(--accent-soft); color:var(--accent)}
.page{padding:20px; min-height:260px; display:grid; gap:10px; align-content:start}
.page p{margin:0}
.shop-brand{font-family:var(--display); font-weight:800; letter-spacing:.08em; text-transform:uppercase; font-size:.9rem; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; border-bottom:1px solid var(--line); padding-bottom:10px}
.shop-brand span{color:var(--muted); letter-spacing:.04em; font-weight:600}
.product{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.2fr); gap:18px}
.boot{aspect-ratio:1; max-width:100%; border-radius:10px; background:var(--surface-2); display:grid; place-items:center}
.boot svg{width:70%; height:auto}
.product h3{font-size:1.15rem}
.price{font-family:var(--display); font-weight:800; font-size:1.5rem; color:var(--flag)}
.price s{font-size:.95rem; color:var(--muted); font-weight:500}
.product .stack{display:grid; gap:8px; align-content:start; font-size:.92rem}
.timer{font-family:var(--mono); font-size:.85rem; color:var(--flag)}
.alarm{background:var(--alarm); color:var(--alarm-ink); padding:28px 22px; text-align:center; display:grid; gap:12px; min-height:280px; align-content:center}
.alarm.prize{background:linear-gradient(135deg, #d4247a, #f0a020)}
.alarm h3{font-size:1.5rem; color:inherit}
.alarm .shield{font-size:2.4rem; line-height:1}
.alarm .call{font-family:var(--mono); font-weight:600; background:#fff; color:#b3261e; padding:8px 12px; border-radius:6px; justify-self:center}
.alarm .hot:hover, .post-card .hot:hover{background:rgba(255,255,255,.2)}
.kidcard{padding:24px 20px; text-align:center; display:grid; gap:10px; justify-items:center}
.kidcard p{margin:0}
.big-emoji{font-size:2.6rem; line-height:1}
.gatebox{display:inline-block; border:1.5px dashed var(--line); border-radius:8px; padding:8px 12px; font-family:var(--mono); font-size:.85rem}
.appstore{display:flex; gap:14px; align-items:center}
.appicon{width:64px; height:64px; border-radius:16px; background:var(--c-kids); color:#fff; display:grid; place-items:center; font-family:var(--display); font-weight:800; font-size:1.3rem; flex:0 0 auto}
.req{display:flex; gap:12px; align-items:flex-start}
.req > div:last-child{display:grid; gap:4px; min-width:0}
.okbadge{color:var(--ok); font-weight:700; font-size:.9rem}
.genpage{display:grid; gap:10px}
.genpage label{display:grid; gap:4px; font-size:.85rem; color:var(--muted)}
.fakeinput{border:1px solid var(--line); border-radius:6px; padding:7px 10px; font-family:var(--mono); color:var(--ink); background:var(--surface-2)}
.comments{display:grid; gap:8px; font-size:.92rem}
.comments > div{background:var(--surface-2); padding:8px 12px; border-radius:10px}
.post{padding:16px; display:grid; gap:12px}
.post-head{display:flex; gap:10px; align-items:center; font-size:.9rem}
.post-card{border-radius:10px; padding:26px 18px; text-align:center; background:linear-gradient(135deg, #7b3fa0, #d9488b); color:#fff; font-family:var(--display); font-weight:800; font-size:1.2rem; line-height:1.4}
.meta{font-size:.82rem; color:var(--muted)}

/* Summary */
.summary{display:grid; gap:22px}
.sum-hero{display:grid; grid-template-columns:auto minmax(0,1fr); gap:24px; align-items:center}
.big{font-family:var(--display); font-weight:800; font-size:clamp(3rem, 9vw, 5.5rem); line-height:1; color:var(--accent); font-variant-numeric:tabular-nums}
.big small{font-size:.35em; color:var(--muted)}
.stats{display:flex; gap:22px; flex-wrap:wrap; margin-top:8px}
.stats div{font-size:.9rem; color:var(--muted)}
.stats b{display:block; font-family:var(--display); font-size:1.5rem; color:var(--ink); font-variant-numeric:tabular-nums}
.grid2{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:20px}
.bars{display:grid; gap:12px}
.bar-row{display:grid; gap:4px; font-size:.92rem}
.bar-row .track{height:8px; border-radius:4px; background:var(--surface-2); overflow:hidden}
.bar-row .fill{height:100%; background:var(--ok); border-radius:4px}
.bar-row.weak .fill{background:var(--flag)}
.bar-row .lbl{display:flex; justify-content:space-between; gap:8px}
.bar-row .lbl span{font-family:var(--mono); font-size:.8rem; color:var(--muted); font-variant-numeric:tabular-nums}
.cheat{list-style:none; margin:0; padding:0; display:grid; gap:10px}
.cheat li b{display:block}
.cheat li span{color:var(--muted); font-size:.93rem}
.card h3{font-size:1.1rem; margin-bottom:12px}

@media (max-width:860px){
  .play, .intro, .grid2{grid-template-columns:minmax(0,1fr)}
  .panel{position:static}
  .product{grid-template-columns:minmax(0,1fr)}
  .boot{max-width:200px}
  .sum-hero{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} }


/* ---- Stronger calls to action ---- */
.btn{padding:14px 22px; font-size:1rem}
.actions .btn{min-height:52px}
.panel .actions .btn{font-size:1.05rem; min-height:60px}
.panel > .btn{width:100%; min-height:56px; font-size:1.05rem}
.gcard{display:flex; flex-direction:column}
.gcard .go{margin-top:auto; display:block; text-align:center; background:var(--gc); color:var(--surface); padding:13px 16px; border-radius:8px; font-weight:800; font-size:1rem}
.gcard:hover .go{filter:brightness(1.08)}
.intro .btn[data-act="start"]{font-size:1.15rem; padding:17px 32px; animation:nudge 2.6s ease-in-out 1.5s infinite}
@keyframes nudge{0%,100%{transform:none}50%{transform:translateY(-3px)}}

/* ---- Bold how-it-works steps ---- */
.hero{max-width:none}
.hero h2, .hero .lede{max-width:780px}
.how{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap:12px; counter-reset:how; margin-top:8px}
.how li{counter-increment:how; display:flex; gap:12px; align-items:center; background:var(--surface); border:2px solid var(--accent); border-radius:12px; padding:14px 16px; font-size:1.05rem; font-weight:600; color:var(--ink); line-height:1.3}
.how li::before{content:counter(how); flex:0 0 auto; width:36px; height:36px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font:800 1.05rem var(--display)}
.how b{font-weight:800; color:var(--accent); font-size:1.15rem}
</style>
</head>
<body>


<div class="wrap" id="wrap">

    <div class="topright"><a class="resultsLink" id="rosterLink" href="#roster" hidden>Roster</a><a class="resultsLink" id="resultsLink" href="#results" hidden>Results log</a><a class="back" id="backLink" href="#" hidden>← All age groups</a><div class="score-pill" id="scorePill" hidden>Score 0</div></div>
  </header>

<script>
/* ---------- Mock-screen helpers ---------- */
const H = (id, html, cls='') => `<span class="hot ${cls}" data-f="${id}" tabindex="0" role="button" aria-pressed="false">${html}</span>`;
const bar = tm => `<div class="phone-bar"><span>${tm.replace(/ (AM|PM)/,'')}</span><span>5G ▮▮▮</span></div>`;
const P = (tm, av, name, sub, msgs) => `<div class="phone">${bar(tm)}
  <div class="sms-head"><div class="avatar">${av}</div><div class="sms-name">${name}</div><div class="sms-sub">${sub}</div></div>
  <div class="sms-body">${msgs.map(m=>`<div class="bubble">${m}</div>`).join('')}</div></div>`;
const CALL = (tm, name, sub, lines) => `<div class="phone">${bar(tm)}
  <div class="call-head"><div class="avatar">☎</div><div class="sms-name">${name}</div><div class="sms-sub">${sub}</div></div>
  <div class="sms-body">${lines.map(([w,x])=>`<div class="bubble ${w==='You'?'me':''}"><span class="spk">${w}</span>${x}</div>`).join('')}</div>
  <div class="call-btns" aria-hidden="true"><i></i><i></i></div></div>`;
const WIN = (barHtml, inner) => `<div class="win"><div class="win-bar"><div class="lights"><i></i><i></i><i></i></div>${barHtml}</div>${inner}</div>`;
const MAIL = (app, {banner='', subj, from, to, body}) => WIN(`<span>${app}</span>`, `${banner}<div class="mail-head"><div class="subj">${subj}</div>
  <div><span class="lbl">From</span>${from}</div><div><span class="lbl">To</span>${to}</div></div><div class="mail-body">${body}</div>`);
const CHAT = (app, head, av, msgs) => WIN(`<span>${app}</span>`, `<div class="chat-head"><div class="avatar">${av}</div><div>${head}</div></div>
  <div class="chat-body">${msgs.map(([w,x])=>`<div class="msg ${w==='You'?'me':''}"><div class="avatar">${w==='You'?'Me':av}</div><div><div class="whoname">${w}</div>${x}</div></div>`).join('')}</div>`);
const WEB = (url, page) => WIN(`<div class="addr">${url}</div>`, `<div class="page">${page}</div>`);
const APP = (app, inner) => WIN(`<span>${app}</span>`, `<div class="page">${inner}</div>`);
const BOOT = `<svg viewBox="0 0 120 100" aria-hidden="true"><path d="M30 10h34l4 40 34 14c8 4 10 10 10 18v6H18l-2-10 8-6z" fill="#8a5a32"/><path d="M16 88h96v8H16z" fill="#2b2b2b"/><path d="M34 22h28M34 32h30M34 42h32" stroke="#e7c9a2" stroke-width="3"/></svg>`;

const CATS = {
  urgency: ['Pressure to act fast', 'Real organizations give you time. A countdown, threat or alarm is your cue to slow down.'],
  sender:  ["Sender doesn't check out", 'Look at the real address, number or profile, not the display name. Strangers and lookalikes are warning signs.'],
  link:    ["Web address doesn't match", 'Read the domain just before the first single slash. Lookalikes add words or misspell the real name.'],
  payment: ['Strange way to pay', 'Gift cards, Zelle, Cash App, crypto, cash couriers or a tiny "fee" are how scammers get paid.'],
  data:    ['Asks for codes, ID, photos or personal details', 'Never share sign-in codes, passwords, ID, photos or account numbers with someone who contacted you.'],
  contact: ['Wants you to call or message them', 'Contact companies using details you find yourself: the back of your card, the official website or app.'],
  toogood: ['Too good to be true', 'Huge discounts, easy money, surprise prizes and instant romance are bait.'],
  secrecy: ['Secrecy or switching apps', '"Keep this between us" or "message me on another app" means they want to avoid anyone checking.'],
};
const KID_CATS = {
  urgency: ['Hurry-up tricks', 'If something says "hurry!", stop and ask a grown-up.'],
  sender:  ['Strangers and pretenders', 'People online can pretend to be anyone, even a kid or the game.'],
  link:    ['Weird links and websites', 'Only get games and updates from the app store, with a grown-up.'],
  data:    ['Asking for passwords, photos or where you live', 'Your password, photos, school and address are private. Keep them that way.'],
  toogood: ['Free stuff that seems too good', 'Free coins, skins and prizes from strangers are tricks.'],
  secrecy: ['Secrets from your grown-ups', 'A safe friend never asks you to keep secrets. Always tell.'],
  payment: ['Asking for money', 'Only grown-ups decide about buying things.'],
  contact: ['Asking you to call', 'Ask a grown-up before contacting anyone.'],
};

/* ---------- Scenarios ----------
   Each age group: 12 scenes, alternating scam / real. Six situations, each shown once as a scam and once for real.
   f: [id, category, label, why]   category 'ok' = a reason it checks out (real scenes).  'n' ids are neutral decoys. */
const GROUPS = {};

GROUPS['little-kids'] = {
  label:'Little kids', ages:'6–10', color:'--c-kids', kid:true,
  labels:['Tricky! Tell a grown-up', 'Looks OK'],
  topics:['Game chat strangers','Free coins','Pop-up prizes','Secrets'],
  headline:'Can you spot the tricks on a Saturday of games?',
  intro:'Maya and Leo love their tablet games. Some messages are friendly and real. Some are tricks. Help them figure out which is which. Grown-ups: play together and talk about each one.',
  people:{ f:{name:'Maya', age:8, blurb:'Loves drawing games and reading apps'}, m:{name:'Leo', age:9, blurb:'Builds everything in BlockQuest'} },
  scenes:[
  { t:'8:10 AM', who:'m', v:'scam', name:'Free coins trick', place:'Tablet · BlockQuest',
    ctx:`Saturday morning. Leo is building a treehouse in BlockQuest when someone types in the chat.`,
    screen: () => CHAT('BlockQuest · World chat', H('f1',`<b>CoinKing99</b> <span class="ext">Not a friend</span>`), 'CK', [
      ['CoinKing99', H('f2',`want 10,000 FREE coins?? 🤑`)],
      ['CoinKing99', `${H('f3',`just tell me ur password`)} and ${H('f4',`ur mom's email`)}`],
      ['CoinKing99', `${H('f5',`hurry!! only for 5 ppl`)} ${H('n1',`👀`)}`]]),
    f:[['f1','sender',`Someone you don't know`,`CoinKing99 is not on your friends list. People in game chat are strangers.`],
       ['f2','toogood',`Free coins`,`Nobody gives away thousands of coins. It's bait to get you to say yes.`],
       ['f3','data',`Asking for your password`,`Your password is only for you and your grown-ups. Never share it, not even with friends.`],
       ['f4','data',`Asking for Mom's email`,`With your password and a grown-up's email, they can steal the whole account.`],
       ['f5','urgency',`Hurry!`,`Rushing you is a trick so you don't stop and ask a grown-up.`]],
    do:`Don't answer. Tap Block and Report, then tell a grown-up what happened. You won't be in trouble.` },

  { t:'9:00 AM', who:'f', v:'safe', name:'Real "ask a grown-up" message', place:'Tablet · Star Reader app',
    ctx:`Maya just finished a story in her reading app. A message pops up about new stories.`,
    screen: () => APP('Star Reader', `<div class="kidcard"><div class="big-emoji">🚀</div><h3>${H('n1',`Space Pack: 10 new stories!`)}</h3>
      <p>${H('f1',`Ask a grown-up to unlock it.`)}</p><p>${H('f2',`For grown-ups: what is 7 × 8?`,'gatebox')}</p><p>${H('f3',`No thanks, keep reading`,'btnlink')}</p></div>`),
    f:[['f1','ok',`Ask a grown-up`,`Good apps send buying decisions to your grown-up.`],
       ['f2','ok',`A grown-up check`,`This little math lock stops kids from buying by accident. That's a safety feature.`],
       ['f3','ok',`An easy "No thanks"`,`You can say no and keep reading. Nobody is rushing you.`]],
    do:`This one is OK. If you want the pack, show a grown-up and let them decide.` },

  { t:'10:15 AM', who:'f', v:'scam', name:'Stranger asking personal questions', place:'Tablet · Doodle Party game',
    ctx:`Maya is playing a drawing game. A player she has never met starts chatting.`,
    screen: () => CHAT('Doodle Party · Chat', H('f1',`<b>Lily_9</b> <span class="ext">Not a friend</span>`), 'L9', [
      ['Lily_9', H('n1',`ur drawings are sooo good!!`)],
      ['Lily_9', H('f2',`i'm 9 too! what school do u go to?`)],
      ['Lily_9', `${H('f3',`send me a pic of u`)} 📸`],
      ['Lily_9', H('f4',`let's keep this our secret ok?`)]]),
    f:[['f1','sender',`Someone you've never met`,`Online, people can pretend to be anyone, even another kid.`],
       ['f2','data',`Asking about your school`,`Your school, address and age help a stranger find you in real life.`],
       ['f3','data',`Asking for a photo`,`Never send pictures of yourself to someone you only know online.`],
       ['f4','secrecy',`A secret`,`A safe friend never asks you to keep secrets from your grown-ups. This is the biggest red flag.`]],
    do:`Stop chatting, don't send anything, and show a grown-up right away. Telling is the brave and smart thing to do.` },

  { t:'11:30 AM', who:'m', v:'safe', name:'Real game update', place:'Tablet · App Store',
    ctx:`Leo wants the new BlockQuest update. He opens the app store on his tablet.`,
    screen: () => APP('App Store', `<div class="appstore"><div class="appicon">BQ</div><div><h3>BlockQuest</h3><div>${H('f1',`Brightbox Games`)}</div><div class="meta">${H('n1',`4.7 ★ · Ages 7+`)}</div></div></div>
      <p>${H('f2',`Update available: new ocean world 🌊`)}</p><p>${H('f3',`Ask to download (a request goes to Dad)`,'btnlink')}</p>`),
    f:[['f1','ok',`The real game maker`,`The update comes from the company that makes BlockQuest, inside the official app store.`],
       ['f2','ok',`An update in the app store`,`Updates should come from the app store, not from a link someone sends you.`],
       ['f3','ok',`Grown-up approval`,`Dad gets a request and decides. That's how it should work.`]],
    do:`OK! Getting games and updates from the real app store, with a grown-up's OK, is the safe way.` },

  { t:'12:40 PM', who:'f', v:'scam', name:'Fake game helper', place:'Tablet · BlockQuest',
    ctx:`Maya gets a message in BlockQuest that looks official.`,
    screen: () => CHAT('BlockQuest · Messages', H('f1',`<b>BQ_Support_Team</b> <span class="ext">Player</span>`), 'BQ', [
      ['BQ_Support_Team', H('f2',`⚠️ YOUR ACCOUNT WILL BE DELETED TODAY!!`)],
      ['BQ_Support_Team', `${H('f3',`Type your password here to keep it`)} 👇`],
      ['BQ_Support_Team', H('n1',`From the BlockQuest team`)]]),
    f:[['f1','sender',`A player pretending to be the game`,`The label says Player. Real game messages come from the game itself, not a player name.`],
       ['f2','urgency',`Scary message`,`Big scary words are meant to make you panic.`],
       ['f3','data',`Asking for your password`,`Real game helpers never ask for your password.`]],
    do:`Don't type anything. Show a grown-up and use Report. Your account is fine.` },

  { t:'2:00 PM', who:'m', v:'safe', name:'Real friend request', place:'Tablet · BlockQuest',
    ctx:`Leo gets a friend request. He played tag with Noah at recess yesterday.`,
    screen: () => APP('BlockQuest · Friends', `<div class="req"><div class="avatar">NK</div><div><b>${H('f1',`Noah K.`)}</b>
      <div>${H('f2',`"it's Noah from Mrs. Lopez's class!"`)}</div><div class="okbadge">${H('f3',`✓ Your parent approved this friend`)}</div></div></div>
      <p>${H('n1',`Accept`,'btnlink')} ${H('n2',`Decline`,'btnlink ghostlink')}</p>`),
    f:[['f1','ok',`Someone you know in real life`,`Leo knows Noah from school.`],
       ['f2','ok',`Details that match`,`He names their real teacher's class.`],
       ['f3','ok',`Parent approved`,`A grown-up checked it first. Perfect.`]],
    do:`OK! Friends you know in real life, approved by a grown-up, are safe to play with.` },

  { t:'3:15 PM', who:'f', v:'scam', name:'Pop-up prize trick', place:'Tablet · video app',
    ctx:`Maya is watching cartoons. Suddenly a flashing box fills the screen.`,
    screen: () => WEB(H('f1',`http://free-prize-winner.club/tablet`,'url'), `<div class="alarm prize"><div class="shield">🎁</div>
      <h3>${H('f2',`YOU WON A FREE TABLET!!!`)}</h3><div>${H('f3',`Only 2 minutes left to claim!`)}</div>
      <div>${H('f4',`Type your home address and mom's phone number`)}</div><div class="call">${H('n1',`CLAIM NOW`)}</div></div>`),
    f:[['f1','link',`A strange website`,`Real prizes don't pop up from weird websites.`],
       ['f2','toogood',`A free tablet`,`You didn't enter a contest. You can't win something you never entered.`],
       ['f3','urgency',`2 minutes left!`,`Timers rush you so you don't ask a grown-up.`],
       ['f4','data',`Address and phone number`,`Never type where you live or a phone number into a pop-up.`]],
    do:`Don't tap anything inside the box. Close the app or show a grown-up.` },

  { t:'4:00 PM', who:'m', v:'safe', name:'Real game event', place:'Tablet · BlockQuest',
    ctx:`Leo opens the News board on the BlockQuest home screen.`,
    screen: () => APP('BlockQuest · News', `<div class="kidcard"><div class="big-emoji">🏰</div><h3>${H('f1',`Official BlockQuest News`)}</h3>
      <p>${H('f2',`Weekend event: build a castle and everyone gets a free knight hat!`)}</p><p>${H('f3',`No password or sign-up needed. Just play.`)}</p><p class="meta">${H('n1',`Ends Sunday`)}</p></div>`),
    f:[['f1','ok',`Inside the game itself`,`It's on the game's own News board, not a chat message from a stranger.`],
       ['f2','ok',`A small gift for everyone`,`Games really do give free hats in events. Everyone gets it just by playing.`],
       ['f3','ok',`Asks for nothing`,`No password, no email, no secrets.`]],
    do:`OK! Have fun. Real game events never ask for passwords.` },

  { t:'5:20 PM', who:'m', v:'scam', name:'Fake secret-level download', place:'Tablet · video app',
    ctx:`Leo is watching a BlockQuest video. A comment says there's a secret level.`,
    screen: () => APP('Video · Comments', `<div class="comments"><div><b>${H('f1',`xX_ModMaster_Xx`)}</b> · 2h<br>${H('f2',`FREE secret level download!!! 🔥`)} ${H('f3',`bit.ly/bq-secret-lvl`,'url')}<br>${H('f4',`turn off the tablet's safety settings first so it works`)}</div>
      <div><b>${H('n1',`gamer_kid22`)}</b> · 1h<br>does it work??</div></div>`),
    f:[['f1','sender',`A random commenter`,`Anyone can post a comment. This isn't the game maker.`],
       ['f2','toogood',`A free secret level`,`"Secret" downloads are often viruses that break the tablet or steal accounts.`],
       ['f3','link',`A short mystery link`,`Short links hide where they really go.`],
       ['f4','secrecy',`Turn off safety settings`,`If something asks you to turn off safety, it's trying to sneak past the protection.`]],
    do:`Don't tap the link. Only get games from the app store, with a grown-up.` },

  { t:'6:00 PM', who:'f', v:'safe', name:'Real game friend', place:'Tablet · Doodle Party game',
    ctx:`Maya plays a round with Sam, a classmate she added with Mom's help. This game only lets kids send ready-made phrases.`,
    screen: () => CHAT('Doodle Party · Quick chat', H('f1',`<b>Sam (from class)</b> <span class="ext ok">Friend</span>`), 'S', [
      ['Sam (from class)', H('f2',`Good game! 🎉`)], ['Sam (from class)', H('f3',`Play again tomorrow?`)], ['You', H('n1',`Yes! 👍`)]]),
    f:[['f1','ok',`A friend you know`,`Sam is in your class, and Mom helped you add them.`],
       ['f2','ok',`Ready-made phrases`,`Quick-chat phrases mean nobody can ask for personal stuff.`],
       ['f3','ok',`A normal friendly question`,`No secrets, no photos, no personal questions.`]],
    do:`OK! This is what a safe game friend looks like.` },

  { t:'6:45 PM', who:'m', v:'scam', name:'Secret-friend request', place:'Tablet · BlockQuest',
    ctx:`Another friend request arrives. Leo doesn't recognize the name.`,
    screen: () => APP('BlockQuest · Friends', `<div class="req"><div class="avatar">PT</div><div><b>${H('f1',`ProGamerTom`)}</b>
      <div class="meta">${H('n1',`Level 87`)} · ${H('f2',`0 friends in common`)}</div><div>${H('f3',`"add me, i give free skins"`)}</div><div>${H('f4',`"but don't tell ur parents we're friends"`)}</div></div></div>
      <p>${H('n2',`Accept`,'btnlink')} ${H('n3',`Decline`,'btnlink ghostlink')}</p>`),
    f:[['f1','sender',`A name you don't know`,`You've never met this player.`],
       ['f2','sender',`Nobody in common`,`None of your friends know this player either.`],
       ['f3','toogood',`Free skins`,`Free gifts from strangers are a trick to make you trust them.`],
       ['f4','secrecy',`Don't tell your parents`,`Anyone who wants to be a secret friend isn't safe. Always tell a grown-up.`]],
    do:`Tap Decline, then tell a grown-up about the message.` },

  { t:'7:30 PM', who:'f', v:'safe', name:'Real game notice', place:'Tablet · BlockQuest',
    ctx:`Before bed, Maya sees a notice from the game. Earlier, Mom said she was changing some settings.`,
    screen: () => APP('BlockQuest · Notices', `<div class="kidcard"><div class="big-emoji">🛡️</div><h3>${H('f1',`BlockQuest System Notice`)}</h3>

/* ---------- Engine ---------- */
const ORDER = ['little-kids','teens','young-adults','thirties','adults','seniors'];
const app = document.getElementById('app');
let state = { route:null, g:null, i:-1, phase:'spot', results:[], run:null, saveStatus:null };
let ASSIGN = null;
try{ ASSIGN = JSON.parse(sessionStorage.getItem('adoAssign') || 'null'); }catch(err){}
let playerName = ASSIGN ? ASSIGN.name : '';
let playerTeam = ASSIGN ? ASSIGN.team : '';
let ROSTER = null, rosterDraft = null, rosterTeam = 'all', resTeam = 'all';
const ARTIFACT_URL = 'https://claude.ai/artifact/7SYrqoEqYd8nA1u63G3wmr';
const GITHUB_URL = 'https://dadcybertips.github.io/EduPage/';
let linkBase = (window.claude && typeof window.claude.use === 'function') ? ARTIFACT_URL : (location.protocol.startsWith('http') ? location.origin + location.pathname : GITHUB_URL);
const hexEnc = s => [...new TextEncoder().encode(s)].map(b=>b.toString(16).padStart(2,'0')).join('');
const hexDec = h => { if(!/^([0-9a-f]{2})+$/.test(h)) return null; try{ return new TextDecoder('utf-8',{fatal:true}).decode(new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)))); }catch(err){ return null; } };
function decodeAssign(h){
  const s = hexDec(h); if(!s) return null;
  const [v, rid, name, team, group] = s.split('|');
  if(v!=='1' || !name) return null;
  return { rid: rid||'', name: name.slice(0,60), team: (team||'').slice(0,60), group: GROUPS[group] ? group : '' };
}
const linkFor = p => `${linkBase.replace(/#.*$/,'')}#p-${hexEnc(['1', p.rid, p.name, p.team, p.group||''].join('|'))}`;
const IN_VIEWER = !!(window.claude && typeof window.claude.use === 'function');
const CAP = { db:null, user:null, dl:null, uid:null, admin:false, ready:!IN_VIEWER };
let RES = null, resFilter = 'all', resOpen = null;

const fl = s => s.f.map(([id,cat,label,why])=>({id,cat,label,why,ok:cat==='ok'}));
const cats = g => g.kid ? KID_CATS : CATS;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip = s => String(s).replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&');
const fmtDate = ts => new Date(ts).toLocaleString(undefined, {month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit'});
function score(){ return state.results.reduce((s,r)=>s+(r?r.points:0),0); }

(async function initCaps(){
  if(!IN_VIEWER) return;
  try{
    const [db, user, dl] = await Promise.all([claude.use('db'), claude.use('user'), claude.use('downloads')]);
    CAP.db = db; CAP.user = user; CAP.dl = dl;
    if(user){ CAP.uid = await user.id(); CAP.admin = (await user.isOwner()) || (await user.canEdit()); }
  }catch(e){}
  CAP.ready = true;
  if(state.run && !state.saveStatus) persist(state.run);
  const g = GROUPS[state.g];
  if(state.route || !g || state.i>=g.scenes.length) render(); else chrome();
})();

function chrome(){
  const g = GROUPS[state.g];
  const wrap = document.getElementById('wrap');
  wrap.className = 'wrap' + (g && g.kid ? ' g-kids' : '');
  if(g) wrap.style.setProperty('--accent', `var(${g.color})`); else wrap.style.removeProperty('--accent');
  document.getElementById('backLink').hidden = !g && !state.route;
  document.getElementById('resultsLink').hidden = !CAP.admin || state.route==='results';
  document.getElementById('rosterLink').hidden = !CAP.admin || state.route==='roster';
  const pill = document.getElementById('scorePill'); pill.hidden = !g || state.i<0; pill.textContent = `Score ${score()}`;
  const tl = document.getElementById('timeline');
  tl.hidden = !g || state.i<0;
  if(g){
    tl.innerHTML = g.scenes.map((s,k)=>{ const r=state.results[k]; return `<span class="tchip ${k===state.i?'now':r?(r.correct?'right':'wrong'):''}">${s.t}</span>`; }).join('');
    const now = tl.querySelector('.now'); if(now) now.scrollIntoView({block:'nearest', inline:'center'});
  }
}

function renderScene(g){
  const s = g.scenes[state.i], flags = fl(s), r = state.results[state.i], reveal = state.phase==='reveal';
  const p = g.people[s.who];
  let panel, legend = '';
  if(!reveal){
    panel = `<p class="context">${s.ctx}</p>
      <p class="hint"><span class="touch-hint">${g.kid?'Tap anything that looks tricky. Tap again to unmark.':'Tap anything that looks suspicious. Tap again to unmark.'} </span><span class="marked-count" id="mc">0 marked</span></p>
      <div class="actions"><button class="btn scam" data-act="verdict" data-v="scam">${g.labels[0]}</button><button class="btn safe" data-act="verdict" data-v="safe">${g.labels[1]}</button></div>`;
  } else {
    const isScam = s.v==='scam';
    const missedN = r.total - r.found;
    const items = flags.map((f,k)=>{
      const got = r.foundIds.includes(f.id);
      const st = f.ok ? '' : `<span class="st ${got?'found':'missed'}">${got?'✓ Spotted':'✗ Missed'}</span>`;
      return `<li class="${!f.ok && !got ? 'missed-row' : ''}"><span class="num ${f.ok||got?'got':''}">${k+1}</span><div><b>${f.label}${st}</b><p>${f.why}</p></div></li>`;
    }).join('');
    const next = state.i < g.scenes.length-1 ? `Next: ${g.scenes[state.i+1].t}` : 'See your report';
    const msg = r.correct ? (isScam ? (g.kid?'Yes! That was a trick.':'Right, this is a scam.') : (g.kid?'Yes! This one is OK.':'Right, this one is real.'))
                          : (isScam ? (g.kid?'Oops, that was a trick.':'Not quite. This is a scam.') : (g.kid?'This one was actually OK.':'Not quite. This one is real.'));
    panel = `<div class="${r.correct?'goodjob':''}">${r.correct?`<div class="gj-badge">✓ Good job!</div>`:''}<div class="scamname">${s.name}</div><div class="verdict ${r.correct?'right':'wrong'}"><span class="dot"></span>${msg}</div>${r.correct && isScam && r.found<r.total?`<p class="gj-note">You made the right call. Now look at the red flags you missed below.</p>`:''}</div>
      ${isScam ? `<p class="hint">You spotted ${r.found} of ${r.total} red flags.</p>` : `<p class="hint">Why it checks out:</p>`}
      ${isScam && missedN ? `<div class="missbox">You missed ${missedN}. ${missedN>1?'They are':'It is'} marked MISSED in red on the screen.</div>` : ''}
      <ul class="flaglist">${items}</ul>
      ${r.falseAlarms ? `<p class="falsenote">${r.falseAlarms} thing${r.falseAlarms>1?'s':''} you marked ${r.falseAlarms>1?'were':'was'} not a red flag (crossed out).</p>` : ''}
      <div class="lesson"><b>What to do</b>${s.do}</div>
      <button class="btn" data-act="next">${next} →</button>`;
    legend = isScam
      ? `<div class="legend"><span><i class="lg-got"></i>You spotted it</span><span><i class="lg-miss"></i>You missed it</span><span><i class="lg-false"></i>Not a red flag</span></div>`
      : `<div class="legend"><span><i class="lg-got"></i>Why it's real</span><span><i class="lg-false"></i>Not a red flag</span></div>`;
  }
  app.innerHTML = `<section class="play">
    <div class="stage ${reveal?'reveal':'spot'}" id="stage"><div class="stage-meta"><span class="clock">${s.t}</span><span class="who">${p.name}, ${p.age}</span><span class="place">${s.place}</span></div>${s.screen(s.t)}${legend}</div>
    <aside class="panel card ${reveal && r.correct ? 'good' : ''}">${panel}</aside></section>`;
  if(reveal){
    document.querySelectorAll('#stage .hot').forEach(el=>{
      const id = el.dataset.f, k = flags.findIndex(f=>f.id===id), f = flags[k], m = r.marked.includes(id);
      el.removeAttribute('tabindex'); el.removeAttribute('role');
      if(f){ el.dataset.n = k+1; el.classList.add(f.ok?'is-ok':'is-flag'); if(!f.ok && !m) el.classList.add('missed'); }
      else if(m) el.classList.add('is-false');
    });
  }
}

/* ---------- Completion report ---------- */
function buildRun(g){
  const rs = state.results, C = cats(g);
  const by = {};
  const scenes = g.scenes.map((s,k)=>{
    const r = rs[k], bad = fl(s).filter(f=>!f.ok);
    bad.forEach(f=>{ by[f.cat] ??= {hit:0,all:0}; by[f.cat].all++; if(r.foundIds.includes(f.id)) by[f.cat].hit++; });
    return { t:s.t, name:s.name, who:g.people[s.who].name, v:s.v, call:r.call, correct:r.correct, found:r.found, total:r.total, falseAlarms:r.falseAlarms,
      missed: bad.filter(f=>!r.foundIds.includes(f.id)).map(f=>f.label) };
  });
  const sorted = Object.entries(by).sort((a,b)=>(a[1].hit/a[1].all)-(b[1].hit/b[1].all));
  const total = scenes.reduce((a,x)=>a+x.total,0);
  return {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), at: Date.now(),
    group: state.g, groupLabel: g.label, name: playerName, team: playerTeam, rid: ASSIGN ? ASSIGN.rid : '',
    score: score(), max: g.scenes.length*10 + total*5,
    correct: scenes.filter(x=>x.correct).length, of: scenes.length,
    scamsCaught: scenes.filter(x=>x.v==='scam'&&x.correct).length, realTrusted: scenes.filter(x=>x.v==='safe'&&x.correct).length,
    found: scenes.reduce((a,x)=>a+x.found,0), total, falseAlarms: scenes.reduce((a,x)=>a+x.falseAlarms,0),
    blindSpot: sorted[0] && sorted[0][1].hit < sorted[0][1].all ? C[sorted[0][0]][0] : '',
    byCat: sorted.map(([c,v])=>({cat:c, label:C[c][0], tip:C[c][1], hit:v.hit, all:v.all})),
    scenes
  };
}

async function persist(run){
  if(!CAP.ready) return;                       // initCaps will call again
  if(!CAP.db || !CAP.uid){ state.saveStatus = 'local'; updateSaveNote(); return; }
  state.saveStatus = 'saving'; updateSaveNote();
  const ref = CAP.db.doc('completions/' + CAP.uid);
  try{
    const snap = await ref.get();
    const runs = snap.exists && Array.isArray(snap.data().runs) ? snap.data().runs.slice() : [];
    if(!runs.some(x=>x.id===run.id)) runs.push(run);
    await ref.set({ uid: CAP.uid, updated: Date.now(), runs: runs.slice(-40) });
    state.saveStatus = 'saved';
  }catch(e){ state.saveStatus = 'failed'; }
  updateSaveNote();
}
function updateSaveNote(){
  const el = document.getElementById('saveNote'); if(!el) return;

}

/* ---------- Roster: personal links for each person ---------- */
const GROUP_ALIASES = { 'little kids':'little-kids', 'kids':'little-kids', 'little-kids':'little-kids', 'teens':'teens', 'teen':'teens',
  'young adults':'young-adults', 'young-adults':'young-adults', 'thirties':'thirties', '30s':'thirties', 'adults in their 30s':'thirties', '30-39':'thirties', '30–39':'thirties', 'adults':'adults', 'aging adults':'adults', 'adult':'adults', 'seniors':'seniors', 'senior':'seniors' };
const slug = s => String(s||'').toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,24);

function parseCSV(text){
  text = String(text||'').replace(/^﻿/,'');
  const first = text.split(/\r?\n/)[0] || '';
  const sep = first.includes('\t') ? '\t' : ',';
  const rows = []; let row = [], cur = '', q = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=c; }
    else if(c==='"') q = true;
    else if(c===sep){ row.push(cur); cur=''; }
    else if(c==='\n' || c==='\r'){ if(c==='\r' && text[i+1]==='\n') i++; row.push(cur); rows.push(row); row=[]; cur=''; }
    else cur += c;
  }
  if(cur!=='' || row.length){ row.push(cur); rows.push(row); }
  return rows.map(r=>r.map(x=>x.trim())).filter(r=>r.some(x=>x));
}

function draftFrom(text, existing){
  const rows = parseCSV(text);
  if(!rows.length) return {entries:[], errors:['The list is empty.']};
  const h = rows[0].map(x=>x.toLowerCase());
  const hasHeader = h.some(x=>/name|team/.test(x));
  const col = (re, d) => { const i = h.findIndex(x=>re.test(x)); return hasHeader ? i : d; };
  const ci = { name: col(/name/,0), team: col(/team|dept|department/,1), group: col(/age|group/,2), email: col(/mail/,3) };
  const used = new Set((existing||[]).map(p=>p.rid));
  const entries = [], errors = [];
  rows.slice(hasHeader?1:0).forEach((r,k)=>{
    const name = (r[ci.name]||'').slice(0,60), team = (ci.team>=0 ? r[ci.team]||'' : '').slice(0,60);
    const gRaw = (ci.group>=0 ? r[ci.group]||'' : '').toLowerCase().trim();
    const group = GROUP_ALIASES[gRaw] || '';
    const email = (ci.email>=0 ? r[ci.email]||'' : '').slice(0,120);
    if(!name){ errors.push(`Row ${k+(hasHeader?2:1)}: no name, skipped.`); return; }
    if(gRaw && !group) errors.push(`Row ${k+(hasHeader?2:1)}: age group "${r[ci.group]}" not recognized, so ${name} will pick their own.`);
    let base = (slug(name) + (team ? '-' + slug(team) : '')) || 'person', rid = base, n = 2;
    while(used.has(rid)) rid = `${base}-${n++}`;
    used.add(rid);
    entries.push({rid, name, team, group, email});
  });
  if(entries.length > 1000){ errors.push('Only the first 1,000 people were kept.'); entries.length = 1000; }
  return {entries, errors};
}

async function loadRoster(quiet){
  if(!CAP.db || !CAP.admin){ ROSTER = {entries: (ROSTER && ROSTER.entries) || [], local:true}; return; }
  try{
    const s = await CAP.db.doc('roster/main').get();
    ROSTER = s.exists ? {entries: (s.data().entries||[]).slice(), updated: s.data().updated} : {entries:[]};
  }catch(err){ ROSTER = ROSTER || {entries:[]}; if(!quiet) ROSTER.error = "Couldn't load the saved roster."; }
}

async function loadRosterPage(){
  ROSTER = {loading:true, entries:[]}; renderRoster();
  await loadRoster();
  ROSTER.done = {};
  if(CAP.db && CAP.admin){
    try{
      const snap = await CAP.db.collection('completions').get();
      snap.docs.forEach(d=>((d.data()||{}).runs||[]).forEach(r=>{ if(!r.rid) return; const cur = ROSTER.done[r.rid]; if(!cur || r.score/r.max > cur.score/cur.max) ROSTER.done[r.rid] = r; }));
    }catch(err){}
  }
  if(state.route==='roster') renderRoster();
}

function renderRoster(){
  document.title = 'A Day Online · Roster';
  let body;
  if(!CAP.ready) body = `<p class="hint">Loading…</p>`;
  else if(IN_VIEWER && !CAP.admin) body = `<p class="hint">Only the page owner and editors can manage the roster.</p>`;
  else if(!ROSTER){ loadRosterPage(); return; }
  else if(ROSTER.loading) body = `<p class="hint">Loading roster…</p>`;
  else {
    const all = ROSTER.entries || [];
    const teams = [...new Set(all.map(p=>p.team).filter(Boolean))].sort();
    const list = all.filter(p=>rosterTeam==='all'||p.team===rosterTeam);
    const done = ROSTER.done || {};
    const finished = list.filter(p=>done[p.rid]).length;
    const draft = rosterDraft ? `<div class="card" style="display:grid;gap:12px"><h3 style="margin:0">Preview: ${rosterDraft.entries.length} people, ${new Set(rosterDraft.entries.map(p=>p.team).filter(Boolean)).size} teams</h3>
        ${rosterDraft.errors.length?`<ul class="savenote bad" style="margin:0;padding-left:18px">${rosterDraft.errors.slice(0,8).map(x=>`<li>${esc(x)}</li>`).join('')}${rosterDraft.errors.length>8?`<li>…and ${rosterDraft.errors.length-8} more</li>`:''}</ul>`:''}
        <div class="tablewrap"><table class="report-table"><thead><tr><th>Name</th><th>Team</th><th>Age group</th><th>Email</th></tr></thead><tbody>${rosterDraft.entries.slice(0,8).map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.team)}</td><td>${p.group?esc(GROUPS[p.group].label):'<span class="meta">They choose</span>'}</td><td>${esc(p.email)}</td></tr>`).join('')}</tbody></table></div>
        ${rosterDraft.entries.length>8?`<p class="hint">Showing 8 of ${rosterDraft.entries.length}.</p>`:''}
        <div class="actions">${rosterDraft.entries.length?(all.length?`<button class="btn" data-act="ro-save-add">Add ${rosterDraft.entries.length} to roster</button><button class="btn ghost" data-act="ro-save-replace">Replace roster</button>`:`<button class="btn" data-act="ro-save-replace">${CAP.db?'Save roster':'Make links'}</button>`):''}<button class="btn ghost" data-act="ro-cancel">Cancel</button></div></div>` : '';
    const rows = list.map(p=>{ const r = done[p.rid]; return `<tr><td><b>${esc(p.name)}</b>${p.email?`<br><span class="meta">${esc(p.email)}</span>`:''}</td><td>${esc(p.team||'–')}</td><td>${p.group?esc(GROUPS[p.group].label):'<span class="meta">They choose</span>'}</td>
      <td>${CAP.db?(r?`<span class="good">✓ Finished</span><br><span class="meta">${r.score}/${r.max} · ${esc(fmtDate(r.at))}</span>`:'<span class="meta">Not started</span>'):'<span class="meta">–</span>'}</td>
      <td><button class="btn ghost" style="padding:6px 12px" data-act="ro-copy" data-rid="${esc(p.rid)}">Copy link</button></td></tr>`; }).join('');
    body = `<div class="card" style="display:grid;gap:12px">
        <h3 style="margin:0">Add people</h3>
        <p class="hint">Paste from Excel or a CSV with columns <b>name, team</b>, and optionally <b>age group</b> (little kids, teens, young adults, 30s, adults, seniors) and <b>email</b>. Each person gets a personal link that fills in their name and team. With an age group, the link opens straight into that day.</p>
        <div class="actions"><label class="btn ghost" for="roFile" style="cursor:pointer">Choose CSV file</label><input id="roFile" type="file" accept=".csv,.txt,.tsv,text/csv" hidden><button class="btn ghost" data-act="ro-template">Get a template</button></div>
        <textarea id="roText" rows="6" placeholder="name,team,age group,email&#10;Jane Example,Sales,adults,jane@example.com" style="width:100%;font:13px var(--mono);border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--ink)"></textarea>
        <div class="actions"><button class="btn" data-act="ro-preview">Preview list</button></div>
        <p class="savenote" id="flash" aria-live="polite"></p></div>
      ${draft}
      ${all.length?`<div class="card tiles"><div><b>${list.length}</b>people</div><div><b>${teams.length}</b>teams</div>${CAP.db?`<div><b>${finished}/${list.length}</b>finished</div><div><b>${list.length?Math.round(finished/list.length*100):0}%</b>completion</div>`:''}</div>
      <div class="card" style="display:grid;gap:14px"><div class="toolbar">
        <div class="actions"><label for="roTeam" class="hint">Team <select id="roTeam"><option value="all">All</option>${teams.map(t=>`<option ${rosterTeam===t?'selected':''}>${esc(t)}</option>`).join('')}</select></label></div>
        <div class="actions"><button class="btn ghost" data-act="ro-copyall">Copy all links</button><button class="btn" data-act="ro-export">Export links CSV</button></div></div>
        <label class="namefield" for="roBase" style="max-width:none">Links point to<input id="roBase" value="${esc(linkBase)}"></label>
        <p class="hint" style="margin:-6px 0 0">Use this page's claude.ai link so results reach your log, or your GitHub Pages address for a public copy (no results log there).</p>
        <div class="tablewrap"><table class="report-table"><thead><tr><th>Person</th><th>Team</th><th>Age group</th><th>Status</th><th>Link</th></tr></thead><tbody>${rows}</tbody></table></div>
        ${CAP.db?'':'<p class="hint">This copy can\'t save the roster. Export the links CSV to keep them.</p>'}</div>`
      : `<p class="hint">No roster yet. Add people above to make their personal links.</p>`}
      ${ROSTER.error?`<p class="savenote bad">${ROSTER.error}</p>`:''}`;
  }
  app.innerHTML = `<section class="summary"><div><h2 style="font-size:clamp(1.8rem,4vw,2.6rem)">Roster and personal links</h2><p class="hint">Send each person their own link. Their name and team fill in automatically, and finished days show up here and in the results log.</p></div>${body}</section>`;
  const f = document.getElementById('roFile');
  if(f) f.addEventListener('change', ()=>{ const file=f.files[0]; if(!file) return; const rd=new FileReader(); rd.onload=()=>{ document.getElementById('roText').value = rd.result; rosterDraft = draftFrom(rd.result, ROSTER.entries); renderRoster(); }; rd.readAsText(file); });
  const t = document.getElementById('roTeam'); if(t) t.addEventListener('change', e=>{ rosterTeam = e.target.value; renderRoster(); });
  const bse = document.getElementById('roBase'); if(bse) bse.addEventListener('change', e=>{ const v=e.target.value.trim(); if(/^https?:\/\//.test(v)) linkBase=v; else e.target.value=linkBase; });
}

const linksCSV = list => { const q=v=>`"${String(v??'').replace(/"/g,'""')}"`; return ['Name,Team,Age group,Email,Link', ...list.map(p=>[p.name,p.team,p.group?GROUPS[p.group].label:'',p.email,linkFor(p)].map(q).join(','))].join('\n'); };

async function rosterAct(act, b){
  const list = (ROSTER && ROSTER.entries || []).filter(p=>rosterTeam==='all'||p.team===rosterTeam);
  if(act==='ro-preview'){ rosterDraft = draftFrom(document.getElementById('roText').value, ROSTER.entries); renderRoster(); return; }
  if(act==='ro-cancel'){ rosterDraft = null; renderRoster(); return; }
  if(act==='ro-template'){ saveFile('a-day-online-roster-template.csv', 'name,team,age group,email\nJane Example,Sales,adults,jane@example.com\nSam Example,Warehouse,adults,sam@example.com\n', 'text/csv'); return; }
  if(act==='ro-save-add' || act==='ro-save-replace'){
    const next = act==='ro-save-add' ? [...ROSTER.entries, ...rosterDraft.entries] : rosterDraft.entries.slice();
    if(CAP.db && CAP.admin){
      b.disabled = true; b.textContent = 'Saving…';
      try{ await CAP.db.doc('roster/main').set({entries: next.slice(0,1000), updated: Date.now()}); ROSTER.entries = next.slice(0,1000); rosterDraft = null; renderRoster(); flash(`Saved ${ROSTER.entries.length} people.`); }
      catch(err){ b.disabled=false; b.textContent='Try saving again'; flash(err && err.code==='quota_exceeded' ? 'The roster is too large to save.' : "Couldn't save the roster."); }
    } else { ROSTER.entries = next; rosterDraft = null; renderRoster(); }
    return;
  }
  if(act==='ro-copy'){
    const p = ROSTER.entries.find(x=>x.rid===b.dataset.rid); if(!p) return;
    try{ await navigator.clipboard.writeText(linkFor(p)); b.textContent='Copied'; setTimeout(()=>{ b.textContent='Copy link'; }, 1500); }
    catch(err){ b.insertAdjacentHTML('afterend', `<input class="fakeinput" style="width:100%;margin-top:6px" readonly value="${esc(linkFor(p))}" onfocus="this.select()">`); b.remove(); }
    return;
  }
  if(act==='ro-copyall'){
    const tsv = ['Name\tTeam\tEmail\tLink', ...list.map(p=>[p.name,p.team,p.email,linkFor(p)].join('\t'))].join('\n');
    try{ await navigator.clipboard.writeText(tsv); flash(`Copied ${list.length} links. Paste them into Excel or a mail merge.`); }
    catch(err){ flash("Copy isn't available here. Use Export links CSV."); }
    return;
  }
  if(act==='ro-export'){ saveFile(`a-day-online-links${rosterTeam==='all'?'':'-'+slug(rosterTeam)}.csv`, linksCSV(list), 'text/csv'); return; }
}

/* ---------- Routing and events ---------- */
function render(){
  const ht = document.getElementById('hoverTip'); if(ht) ht.className = '';
  chrome();
  if(state.route==='results') return renderResults();
  if(state.route==='roster') return renderRoster();
  const g = GROUPS[state.g];
  if(!g) renderLanding();
  else if(state.i<0) renderIntro(g);
  else if(state.i>=g.scenes.length) renderSummary(g);
  else renderScene(g);
}

function route(){
  let h = location.hash.slice(1);
  if(h.startsWith('p-')){
    const a = decodeAssign(h.slice(2));
    if(a){ ASSIGN = a; playerName = a.name; playerTeam = a.team; try{ sessionStorage.setItem('adoAssign', JSON.stringify(a)); }catch(err){} }
    if(a && a.group){ location.replace('#' + a.group); return; }
    h = '';
  }
  state = { route: (h==='results'||h==='roster') ? h : null, g: GROUPS[h] ? h : null, i:-1, phase:'spot', results:[], run:null, saveStatus:null };
  if(h==='results') RES = null;
  if(h==='roster') rosterDraft = null;
  render(); window.scrollTo(0,0);
}

function toggle(el){
  if(state.phase!=='spot') return;
  const on = el.classList.toggle('marked'); el.setAttribute('aria-pressed', on);
  if(tip.classList.contains('show')) showTip(el, tipX, tipY);
  const mc = document.getElementById('mc'); if(mc) mc.textContent = `${document.querySelectorAll('#stage .hot.marked').length} marked`;
}

app.addEventListener('click', async e=>{
  const hot = e.target.closest('#stage .hot'); if(hot){ toggle(hot); return; }
  const row = e.target.closest('tr[data-run]'); if(row){ resOpen = resOpen===row.dataset.run ? null : row.dataset.run; renderResults(); return; }
  const b = e.target.closest('button[data-act]'); if(!b) return;
  const g = GROUPS[state.g], act = b.dataset.act;
  if(act && act.startsWith('ro-')){ rosterAct(act, b); return; }
  if(act==='copy-report'){
    const text = reportText(state.run);
    try{ await navigator.clipboard.writeText(text); flash('Copied.'); }
    catch(err){ const ta=document.getElementById('copyText'); ta.hidden=false; ta.value=text; ta.focus(); ta.select(); flash('Select all and copy the text below.'); }
    return;
  }
  if(act==='dl-report'){ const r=state.run; saveFile(`a-day-online-${r.group}-${new Date(r.at).toISOString().slice(0,10)}.html`, reportHTML(r), 'text/html'); return; }
  if(act==='export-csv'){ saveFile(`a-day-online-results-${new Date().toISOString().slice(0,10)}.csv`, csv(), 'text/csv'); return; }
  if(act==='refresh'){ loadResults(); return; }
  if(act==='start'){ const n=document.getElementById('playerName'), t=document.getElementById('playerTeam'); playerName = n ? n.value.trim().slice(0,60) : ''; if(t) playerTeam = t.value.trim().slice(0,60); state.i=0; state.phase='spot'; }
  if(act==='clear-assign'){ ASSIGN=null; playerName=''; playerTeam=''; try{ sessionStorage.removeItem('adoAssign'); }catch(err){} location.hash=''; return; }
  if(act==='verdict'){
    const s = g.scenes[state.i], flags = fl(s);
    const marked = [...document.querySelectorAll('#stage .hot.marked')].map(x=>x.dataset.f);
    const bad = flags.filter(f=>!f.ok), foundIds = bad.filter(f=>marked.includes(f.id)).map(f=>f.id);
    const falseAlarms = marked.filter(id=>!flags.some(f=>f.id===id)).length;
    const correct = b.dataset.v===s.v;
    state.results[state.i] = {marked, foundIds, found:foundIds.length, total:bad.length, falseAlarms, correct, call:b.dataset.v, points:(correct?10:0)+foundIds.length*5};
    state.phase='reveal';
  }
  if(act==='next'){ state.i++; state.phase='spot'; }
  if(act==='restart'){ state.i=-1; state.phase='spot'; state.results=[]; state.run=null; state.saveStatus=null; }
  render(); window.scrollTo({top:0, behavior:'smooth'});
});
const tip = Object.assign(document.createElement('div'), {id:'hoverTip', role:'tooltip'});
document.body.appendChild(tip);
let tipX = null, tipY = null;
function placeTip(x, y){
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let left = x + 14, top = y + 18;
  if(left + w > window.innerWidth - 8) left = x - w - 10;
  if(top + h > window.innerHeight - 8) top = y - h - 12;
  tip.style.left = Math.max(8, left) + 'px'; tip.style.top = Math.max(8, top) + 'px';
}
function showTip(el, x, y){
  tip.textContent = el.classList.contains('marked') ? 'Selected. Click again to unselect' : 'Select what looks suspicious';
  if(x == null){ const r = el.getBoundingClientRect(); x = r.left + Math.min(r.width, 40); y = r.bottom - 8; }
  placeTip(x, y); tip.className = 'show';
}
function hideTip(){ tip.className = ''; }
app.addEventListener('mousemove', e=>{ tipX = e.clientX; tipY = e.clientY; const h = e.target.closest('.spot .hot'); if(h) showTip(h, tipX, tipY); else hideTip(); });
app.addEventListener('mouseleave', hideTip);
app.addEventListener('focusin', e=>{ const h = e.target.closest('.spot .hot'); if(h && h.matches(':focus-visible')) showTip(h); });
app.addEventListener('focusout', hideTip);
window.addEventListener('scroll', hideTip, {passive:true});
app.addEventListener('keydown', e=>{ const hot=e.target.closest('#stage .hot'); if(hot && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); toggle(hot); } });
window.addEventListener('hashchange', route);
route();
</script>
