<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important} body{margin:0} img{max-width:100%}</style>
<title>A Day Online</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: landing = hero + five age-group cards. Game = timeline strip, mock screen left, coaching panel right (stacked on phones). */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f6f8fa; --ink:#16212a; --muted:#5a6773; --line:#d4dbe2;
  --accent:#1d5c74; --accent-ink:#ffffff;
  --flag:#c4441d; --flag-soft:#fbe4da; --ok:#2c7a4c; --ok-soft:#dcefe3; --mark:#d99a0b; --mark-soft:#fdf0c6;
  --bubble:#e7ebef; --alarm:#b3261e; --alarm-ink:#ffffff;
  --c-kids:#b5541a; --c-teens:#6a3fb5; --c-young:#1b6f69; --c-thirties:#5b6b12; --c-hr:#2f7a3a; --c-rd:#8a6a00; --c-adults:#1d5c74; --c-seniors:#8a3b5a;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f161b; --surface:#172129; --surface-2:#1d2932; --ink:#e5ebf0; --muted:#94a3ae; --line:#2b3842;
  --accent:#6bb4d0; --accent-ink:#0b1a21;
  --flag:#ff7f57; --flag-soft:#3b2219; --ok:#6fcb95; --ok-soft:#1b3426; --mark:#f2c14e; --mark-soft:#3a3115;
  --bubble:#25323c; --alarm:#c2382f; --alarm-ink:#ffffff;
  --c-kids:#f0a36b; --c-teens:#b79af0; --c-young:#6cc9c1; --c-thirties:#bcd36a; --c-hr:#8fd49a; --c-rd:#e6c35c; --c-adults:#6bb4d0; --c-seniors:#e59ab8; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f161b; --surface:#172129; --surface-2:#1d2932; --ink:#e5ebf0; --muted:#94a3ae; --line:#2b3842;
  --accent:#6bb4d0; --accent-ink:#0b1a21;
  --flag:#ff7f57; --flag-soft:#3b2219; --ok:#6fcb95; --ok-soft:#1b3426; --mark:#f2c14e; --mark-soft:#3a3115;
  --bubble:#25323c; --alarm:#c2382f; --alarm-ink:#ffffff;
  --c-kids:#f0a36b; --c-teens:#b79af0; --c-young:#6cc9c1; --c-thirties:#bcd36a; --c-hr:#8fd49a; --c-rd:#e6c35c; --c-adults:#6bb4d0; --c-seniors:#e59ab8; color-scheme:dark }
:root, .wrap{--accent-soft:color-mix(in srgb, var(--accent) 14%, var(--surface))}

body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.5}
.wrap{max-width:1120px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:20px 48px}
.wrap.g-kids{font-size:17px}
h1,h2,h3{font-family:var(--display); text-wrap:balance; margin:0; line-height:1.15}
button{font:inherit; cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}

.top{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink)}
.brand-mark{width:30px; height:30px; border-radius:50%; background:conic-gradient(var(--flag) 0 25%, var(--accent) 0 100%); position:relative}
.brand-mark::after{content:""; position:absolute; inset:7px; border-radius:50%; background:var(--bg)}
.brand h1{font-size:1.35rem; font-weight:800; letter-spacing:-.01em}
.topright{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.score-pill{font-family:var(--mono); font-size:.85rem; background:var(--surface); border:1px solid var(--line); padding:4px 10px; border-radius:999px; font-variant-numeric:tabular-nums}
.back{font-size:.92rem; text-decoration:none; font-weight:600}

.timeline{display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:20px; scrollbar-width:thin}
.tchip{flex:0 0 auto; font-family:var(--mono); font-size:.78rem; padding:5px 9px; border-radius:6px; background:var(--surface); border:1px solid var(--line); color:var(--muted); font-variant-numeric:tabular-nums}
.tchip.now{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.tchip.right{border-color:var(--ok); color:var(--ok)}
.tchip.wrong{border-color:var(--flag); color:var(--flag)}

/* Landing */
.hero{display:grid; gap:14px; margin:12px 0 28px; max-width:780px}
.hero h2{font-size:clamp(2.1rem, 5.5vw, 3.6rem); font-weight:800; letter-spacing:-.02em}
.hero h2 em{font-style:normal; color:var(--flag)}
.lede{font-size:1.12rem; color:var(--muted); max-width:62ch; margin:0}
.how{display:flex; flex-wrap:wrap; gap:8px 22px; font-size:.95rem; color:var(--muted); margin:0; padding:0; list-style:none}
.how b{color:var(--ink)}
.groups{display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap:16px}
.gcard{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px; display:grid; gap:10px; align-content:start; text-decoration:none; color:var(--ink); transition:border-color .15s, transform .15s}
.gcard:hover{border-color:var(--gc); transform:translateY(-2px)}
.gcard .ages{font-family:var(--display); font-weight:800; font-size:2.4rem; line-height:1; color:var(--gc); font-variant-numeric:tabular-nums}
.gcard h3{font-size:1.3rem}
.gcard .people{font-size:.92rem; color:var(--muted)}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{font-size:.8rem; border:1px solid var(--line); border-radius:999px; padding:2px 9px; color:var(--muted)}
.gcard .go{font-weight:700; color:var(--gc); margin-top:4px}
.note{margin-top:28px; color:var(--muted); font-size:.95rem; max-width:70ch}

/* Group intro */
.intro{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:28px; align-items:start}
.intro h2{font-size:clamp(1.9rem, 4.6vw, 3rem); font-weight:800; letter-spacing:-.02em}
.intro .lede{margin:14px 0 20px}
.steps{display:grid; gap:10px; margin:0 0 24px; padding:0; list-style:none; counter-reset:s}
.steps li{display:flex; gap:12px; align-items:baseline; counter-increment:s}
.steps li::before{content:counter(s); font-family:var(--mono); font-size:.8rem; font-weight:600; color:var(--accent); border:1.5px solid var(--accent); border-radius:50%; width:24px; height:24px; display:inline-grid; place-items:center; flex:0 0 auto}
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px}
.personas{display:grid; gap:14px}
.persona-head{display:flex; gap:14px; align-items:center}
.persona-av{width:48px; height:48px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; font-family:var(--display); font-weight:800; font-size:1.1rem; flex:0 0 auto}
.persona-head h3{font-size:1.1rem}
.persona-head p{margin:0; color:var(--muted); font-size:.93rem}
.btn{border:0; border-radius:10px; padding:12px 18px; font-weight:700; background:var(--accent); color:var(--accent-ink); text-decoration:none; display:inline-block}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--line)}
.btn.scam{background:var(--flag); color:#fff}
.btn.safe{background:var(--ok); color:#fff}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn.scam, :root:not([data-theme="light"]) .btn.safe{color:#10181d}}
:root[data-theme="dark"] .btn.scam, :root[data-theme="dark"] .btn.safe{color:#10181d}

/* Play */
.play{display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:24px; align-items:start}
.stage-meta{display:flex; gap:10px; align-items:baseline; margin-bottom:10px; flex-wrap:wrap}
.clock{font-family:var(--display); font-weight:800; font-size:2rem; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.place{color:var(--muted)}
.who{font-size:.8rem; font-weight:700; background:var(--accent-soft); color:var(--accent); border-radius:999px; padding:2px 10px}
.panel.card.good{border-color:var(--ok)}
.panel{position:sticky; top:calc(env(safe-area-inset-top, 0px) + 12px); display:grid; gap:14px}
.context{font-size:1.05rem; margin:0}
.hint{color:var(--muted); font-size:.95rem; margin:0}
.marked-count{font-family:var(--mono); font-size:.82rem; color:var(--mark)}
.actions{display:flex; gap:10px; flex-wrap:wrap}
.actions .btn{flex:1 1 140px; text-align:center}
.verdict{display:flex; gap:10px; align-items:center; font-family:var(--display); font-weight:800; font-size:1.3rem}
.verdict .dot{width:12px; height:12px; border-radius:50%; flex:0 0 auto}
.verdict.right .dot{background:var(--ok)} .verdict.wrong .dot{background:var(--flag)}
.goodjob{background:var(--ok-soft); border:2px solid var(--ok); border-radius:10px; padding:12px 14px; display:grid; gap:4px}
.goodjob .verdict{color:var(--ok)}
.gj-badge{justify-self:start; background:var(--ok); color:var(--surface); font-weight:800; font-size:.85rem; padding:3px 10px; border-radius:999px}
.gj-note{margin:2px 0 0; font-size:.92rem; color:var(--ink)}
.scamname{font-family:var(--mono); font-size:.78rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted)}
.flaglist{list-style:none; margin:0; padding:0; display:grid; gap:10px}
.flaglist li{display:grid; grid-template-columns:26px minmax(0,1fr); gap:10px; align-items:start}
.num{font-family:var(--mono); font-size:.75rem; font-weight:600; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; background:var(--flag); color:#fff}
.num.ok{background:var(--ok)}
.flaglist b{display:block}
.flaglist .st{font-family:var(--mono); font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; margin-left:6px}
.st.found{color:var(--ok)} .st.missed{color:var(--flag)}
.flaglist p{margin:2px 0 0; color:var(--muted); font-size:.95rem}
.lesson{background:var(--accent-soft); border-radius:10px; padding:12px 14px}
.lesson b{font-family:var(--mono); font-size:.75rem; text-transform:uppercase; letter-spacing:.08em; color:var(--accent); display:block; margin-bottom:2px}
.falsenote{font-size:.9rem; color:var(--muted); margin:0}

/* Hotspots */
.hot{cursor:pointer; border-radius:4px; transition:background .15s, box-shadow .15s; position:relative}
.spot .hot:hover{background:var(--mark-soft)}
.hot.marked{background:var(--mark-soft); box-shadow:0 0 0 2px var(--mark)}
.spot .hot.btnlink:hover, .hot.btnlink.marked{background:var(--accent); color:var(--accent-ink)}
.spot .hot.ghostlink:hover, .hot.ghostlink.marked{background:transparent; color:var(--ink)}
.reveal .hot{cursor:default}
.reveal .hot.marked{background:transparent; box-shadow:none}
.reveal .hot.is-flag{box-shadow:0 0 0 2px var(--ok); background:var(--ok-soft)}
.reveal .hot.is-flag[data-n]::after{background:var(--ok)}
.reveal .hot.is-flag.missed{font-weight:800; background:var(--flag-soft); box-shadow:0 0 0 3px var(--flag); outline:3px dashed var(--flag); outline-offset:4px; animation:pulse 1.4s ease-in-out 3}
.reveal .hot.is-flag.missed[data-n]::after{background:var(--flag); width:22px; height:22px; line-height:22px; font-size:12px; top:-13px; right:-13px}
.reveal .hot.is-flag.missed::before{content:"MISSED"; position:absolute; left:-4px; top:-22px; background:var(--flag); color:#fff; font:700 10px/1 var(--mono); letter-spacing:.08em; padding:3px 5px; border-radius:3px; z-index:3; white-space:nowrap}
@keyframes pulse{50%{outline-offset:8px}}
.legend{display:flex; flex-wrap:wrap; gap:6px 16px; font-size:.85rem; color:var(--muted); margin:14px 0 0}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{width:14px; height:14px; border-radius:3px; display:inline-block}
.legend .lg-miss{background:var(--flag-soft); box-shadow:0 0 0 2px var(--flag)}
.legend .lg-got{background:var(--ok-soft); box-shadow:0 0 0 2px var(--ok)}
.legend .lg-false{background:var(--surface-2); box-shadow:0 0 0 1px var(--line)}
.flaglist li.missed-row{background:var(--flag-soft); border-radius:8px; padding:8px; margin:-4px -8px; box-shadow:inset 3px 0 0 var(--flag)}
.flaglist li.missed-row b{color:var(--flag)}
.flaglist li.missed-row p{color:var(--ink)}
.num.got{background:var(--ok)}
.st.missed{font-weight:800; font-size:.78rem}
.missbox{background:var(--flag-soft); border-radius:10px; padding:10px 14px; font-weight:700; color:var(--flag)}
/* Report + results log */
.namefield{display:grid; gap:4px; margin:0 0 18px; max-width:340px; font-size:.9rem; color:var(--muted)}
.namefield input, .toolbar select{font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:9px 12px}
.report-table{width:100%; border-collapse:collapse; font-size:.92rem}
.report-table th{text-align:left; font-family:var(--mono); font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap}
.report-table td{padding:10px; border-bottom:1px solid var(--line); vertical-align:top}
.report-table td.num-c{font-variant-numeric:tabular-nums; white-space:nowrap}
.report-table .miss{color:var(--flag); font-weight:700}
.report-table .good{color:var(--ok); font-weight:700}
.report-table tr.click{cursor:pointer} .report-table tr.click:hover td{background:var(--surface-2)}
.tablewrap{overflow-x:auto}
.toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between}
.savenote{font-size:.88rem; color:var(--muted); margin:0}
.savenote.ok{color:var(--ok)} .savenote.bad{color:var(--flag)}
.tiles{display:flex; flex-wrap:wrap; gap:22px}
.tiles div{font-size:.9rem; color:var(--muted)}
.tiles b{display:block; font-family:var(--display); font-size:1.6rem; color:var(--ink); font-variant-numeric:tabular-nums}
.detail td{background:var(--surface-2)}
.detail ul{margin:6px 0 0; padding-left:18px}
.resultsLink{font-size:.92rem; font-weight:600; text-decoration:none}
#hoverTip{position:fixed; z-index:50; pointer-events:none; background:var(--ink); color:var(--bg); font:600 .8rem/1.2 var(--body); padding:7px 10px; border-radius:6px; white-space:nowrap; box-shadow:0 6px 18px -6px rgba(0,0,0,.45); opacity:0; transform:translateY(4px); transition:opacity .12s}
#hoverTip.show{opacity:1; transform:none}
@media (hover:none){ #hoverTip{display:none} }
.fields{display:flex; flex-wrap:wrap; gap:0 14px}
.fields .namefield{flex:1 1 200px}
.namefield input[readonly]{background:var(--surface-2)}
.welcome{display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:8px; border-color:var(--accent)}
.reveal .hot.is-ok{box-shadow:0 0 0 2px var(--ok); background:var(--ok-soft)}
.reveal .hot.is-false{text-decoration:line-through; text-decoration-color:var(--muted); background:var(--surface-2)}
.reveal .hot[data-n]::after{content:attr(data-n); position:absolute; top:-10px; right:-10px; width:18px; height:18px; border-radius:50%; background:var(--flag); color:#fff; font:600 11px/18px var(--mono); text-align:center; z-index:2}
.reveal .hot.is-ok[data-n]::after{background:var(--ok)}
.reveal .banner[data-n]::after{top:8px; right:10px}
.alarm .hot.is-flag, .post-card .hot.is-flag{background:transparent; box-shadow:0 0 0 2px #fff}
.alarm .hot.is-flag.missed{outline-color:#fff}

/* Mock: phone */
.phone{max-width:360px; margin:0 auto; background:var(--surface); border:10px solid var(--ink); border-radius:34px; overflow:hidden; box-shadow:0 18px 40px -20px rgba(10,20,30,.45)}
.phone-bar{display:flex; justify-content:space-between; padding:8px 18px 4px; font:600 .78rem var(--mono); color:var(--ink)}
.sms-head{display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 14px 12px; border-bottom:1px solid var(--line); text-align:center}
.avatar{width:44px; height:44px; border-radius:50%; background:var(--bubble); display:grid; place-items:center; font-weight:700; color:var(--muted); flex:0 0 auto; font-size:.85rem}
.sms-name{font-weight:700; font-size:.95rem}
.sms-sub{font-size:.75rem; color:var(--muted)}
.call-head{padding:22px 14px 16px; text-align:center; display:grid; gap:6px; justify-items:center; border-bottom:1px solid var(--line)}
.call-head .avatar{width:64px; height:64px; font-size:1.2rem}
.call-btns{display:flex; justify-content:center; gap:40px; padding:4px 0 18px}
.call-btns i{width:46px; height:46px; border-radius:50%; display:block}
.call-btns i:first-child{background:var(--flag)} .call-btns i:last-child{background:var(--ok)}
.sms-body{padding:16px 14px 22px; display:grid; gap:8px; min-height:240px; align-content:start}
.bubble{background:var(--bubble); border-radius:18px 18px 18px 6px; padding:10px 13px; max-width:88%; font-size:.95rem; overflow-wrap:anywhere}
.bubble.me{justify-self:end; background:var(--accent-soft); border-radius:18px 18px 6px 18px}
.spk{display:block; font-size:.72rem; font-family:var(--mono); color:var(--muted); text-transform:uppercase; letter-spacing:.05em}
.url{font-family:var(--mono); font-size:.85em; color:var(--accent); text-decoration:underline; overflow-wrap:anywhere}

/* Mock: windows */
.win{background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden; box-shadow:0 18px 40px -24px rgba(10,20,30,.45)}
.win-bar{display:flex; align-items:center; gap:8px; padding:9px 12px; background:var(--surface-2); border-bottom:1px solid var(--line); font-size:.82rem; color:var(--muted); min-width:0}
.lights{display:flex; gap:5px; flex:0 0 auto} .lights i{width:10px; height:10px; border-radius:50%; background:var(--line); display:block}
.addr{flex:1; min-width:0; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:4px 12px; font-family:var(--mono); font-size:.8rem; color:var(--ink); overflow-wrap:anywhere}
.banner{display:block; background:var(--mark-soft); color:var(--ink); padding:8px 16px; font-size:.85rem; border-bottom:1px solid var(--line)}
.mail-head{padding:14px 18px; border-bottom:1px solid var(--line); display:grid; gap:4px; font-size:.92rem; overflow-wrap:anywhere}
.mail-head .subj{font-family:var(--display); font-weight:700; font-size:1.2rem; margin-bottom:4px}
.mail-head .lbl{color:var(--muted); display:inline-block; width:44px}
.mail-body{padding:18px; font-size:.97rem; overflow-wrap:anywhere}
.btnlink{display:inline-block; background:var(--accent); color:var(--accent-ink); padding:8px 16px; border-radius:6px; font-weight:700}
.ghostlink{background:transparent; color:var(--ink); border:1.5px solid var(--line)}
.hoverurl{display:block; margin-top:8px; font-size:.8rem; color:var(--muted)}
.chat-head{display:flex; gap:10px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); font-size:.92rem; flex-wrap:wrap}
.ext{font-family:var(--mono); font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; background:var(--mark-soft); color:var(--ink); padding:1px 6px; border-radius:4px}
.ext.ok{background:var(--ok-soft); color:var(--ok)}
.chat-body{padding:16px; display:grid; gap:12px; min-height:240px; align-content:start}
.msg{display:grid; grid-template-columns:34px minmax(0,1fr); gap:10px}
.msg .avatar{width:34px; height:34px; font-size:.75rem}
.msg .whoname{font-size:.8rem; color:var(--muted); font-weight:700}
.msg.me .avatar{background:var(--accent-soft); color:var(--accent)}
.page{padding:20px; min-height:260px; display:grid; gap:10px; align-content:start}
.page p{margin:0}
.shop-brand{font-family:var(--display); font-weight:800; letter-spacing:.08em; text-transform:uppercase; font-size:.9rem; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; border-bottom:1px solid var(--line); padding-bottom:10px}
.shop-brand span{color:var(--muted); letter-spacing:.04em; font-weight:600}
.product{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.2fr); gap:18px}
.boot{aspect-ratio:1; max-width:100%; border-radius:10px; background:var(--surface-2); display:grid; place-items:center}
.boot svg{width:70%; height:auto}
.product h3{font-size:1.15rem}
.price{font-family:var(--display); font-weight:800; font-size:1.5rem; color:var(--flag)}
.price s{font-size:.95rem; color:var(--muted); font-weight:500}
.product .stack{display:grid; gap:8px; align-content:start; font-size:.92rem}
.timer{font-family:var(--mono); font-size:.85rem; color:var(--flag)}
.alarm{background:var(--alarm); color:var(--alarm-ink); padding:28px 22px; text-align:center; display:grid; gap:12px; min-height:280px; align-content:center}
.alarm.prize{background:linear-gradient(135deg, #d4247a, #f0a020)}
.alarm h3{font-size:1.5rem; color:inherit}
.alarm .shield{font-size:2.4rem; line-height:1}
.alarm .call{font-family:var(--mono); font-weight:600; background:#fff; color:#b3261e; padding:8px 12px; border-radius:6px; justify-self:center}
.alarm .hot:hover, .post-card .hot:hover{background:rgba(255,255,255,.2)}
.kidcard{padding:24px 20px; text-align:center; display:grid; gap:10px; justify-items:center}
.kidcard p{margin:0}
.big-emoji{font-size:2.6rem; line-height:1}
.gatebox{display:inline-block; border:1.5px dashed var(--line); border-radius:8px; padding:8px 12px; font-family:var(--mono); font-size:.85rem}
.appstore{display:flex; gap:14px; align-items:center}
.appicon{width:64px; height:64px; border-radius:16px; background:var(--c-kids); color:#fff; display:grid; place-items:center; font-family:var(--display); font-weight:800; font-size:1.3rem; flex:0 0 auto}
.req{display:flex; gap:12px; align-items:flex-start}
.req > div:last-child{display:grid; gap:4px; min-width:0}
.okbadge{color:var(--ok); font-weight:700; font-size:.9rem}
.genpage{display:grid; gap:10px}
.genpage label{display:grid; gap:4px; font-size:.85rem; color:var(--muted)}
.fakeinput{border:1px solid var(--line); border-radius:6px; padding:7px 10px; font-family:var(--mono); color:var(--ink); background:var(--surface-2)}
.comments{display:grid; gap:8px; font-size:.92rem}
.comments > div{background:var(--surface-2); padding:8px 12px; border-radius:10px}
.post{padding:16px; display:grid; gap:12px}
.post-head{display:flex; gap:10px; align-items:center; font-size:.9rem}
.post-card{border-radius:10px; padding:26px 18px; text-align:center; background:linear-gradient(135deg, #7b3fa0, #d9488b); color:#fff; font-family:var(--display); font-weight:800; font-size:1.2rem; line-height:1.4}
.meta{font-size:.82rem; color:var(--muted)}

/* Summary */
.summary{display:grid; gap:22px}
.sum-hero{display:grid; grid-template-columns:auto minmax(0,1fr); gap:24px; align-items:center}
.big{font-family:var(--display); font-weight:800; font-size:clamp(3rem, 9vw, 5.5rem); line-height:1; color:var(--accent); font-variant-numeric:tabular-nums}
.big small{font-size:.35em; color:var(--muted)}
.stats{display:flex; gap:22px; flex-wrap:wrap; margin-top:8px}
.stats div{font-size:.9rem; color:var(--muted)}
.stats b{display:block; font-family:var(--display); font-size:1.5rem; color:var(--ink); font-variant-numeric:tabular-nums}
.grid2{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:20px}
.bars{display:grid; gap:12px}
.bar-row{display:grid; gap:4px; font-size:.92rem}
.bar-row .track{height:8px; border-radius:4px; background:var(--surface-2); overflow:hidden}
.bar-row .fill{height:100%; background:var(--ok); border-radius:4px}
.bar-row.weak .fill{background:var(--flag)}
.bar-row .lbl{display:flex; justify-content:space-between; gap:8px}
.bar-row .lbl span{font-family:var(--mono); font-size:.8rem; color:var(--muted); font-variant-numeric:tabular-nums}
.cheat{list-style:none; margin:0; padding:0; display:grid; gap:10px}
.cheat li b{display:block}
.cheat li span{color:var(--muted); font-size:.93rem}
.card h3{font-size:1.1rem; margin-bottom:12px}

@media (max-width:860px){
  .play, .intro, .grid2{grid-template-columns:minmax(0,1fr)}
  .panel{position:static}
  .product{grid-template-columns:minmax(0,1fr)}
  .boot{max-width:200px}
  .sum-hero{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} }


/* ---- Stronger calls to action ---- */
.btn{padding:14px 22px; font-size:1rem}
.actions .btn{min-height:52px}
.panel .actions .btn{font-size:1.05rem; min-height:60px}
.panel > .btn{width:100%; min-height:56px; font-size:1.05rem}
.gcard{display:flex; flex-direction:column}
.gcard .go{margin-top:auto; display:block; text-align:center; background:var(--gc); color:var(--surface); padding:13px 16px; border-radius:8px; font-weight:800; font-size:1rem}
.gcard:hover .go{filter:brightness(1.08)}
.intro .btn[data-act="start"]{font-size:1.15rem; padding:17px 32px; animation:nudge 2.6s ease-in-out 1.5s infinite}
@keyframes nudge{0%,100%{transform:none}50%{transform:translateY(-3px)}}

/* ---- Bold how-it-works steps ---- */
.hero{max-width:none}
.hero h2, .hero .lede{max-width:780px}
.how{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap:12px; counter-reset:how; margin-top:8px}
.how li{counter-increment:how; display:flex; gap:12px; align-items:center; background:var(--surface); border:2px solid var(--accent); border-radius:12px; padding:14px 16px; font-size:1.05rem; font-weight:600; color:var(--ink); line-height:1.3}
.how li::before{content:counter(how); flex:0 0 auto; width:36px; height:36px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font:800 1.05rem var(--display)}
.how b{font-weight:800; color:var(--accent); font-size:1.15rem}
</style>
</head>

<script>
/* ---------- Mock-screen helpers ---------- */
const H = (id, html, cls='') => `<span class="hot ${cls}" data-f="${id}" tabindex="0" role="button" aria-pressed="false">${html}</span>`;
const bar = tm => `<div class="phone-bar"><span>${tm.replace(/ (AM|PM)/,'')}</span><span>5G ▮▮▮</span></div>`;
const P = (tm, av, name, sub, msgs) => `<div class="phone">${bar(tm)}
  <div class="sms-head"><div class="avatar">${av}</div><div class="sms-name">${name}</div><div class="sms-sub">${sub}</div></div>
  <div class="sms-body">${msgs.map(m=>`<div class="bubble">${m}</div>`).join('')}</div></div>`;
const CALL = (tm, name, sub, lines) => `<div class="phone">${bar(tm)}
  <div class="call-head"><div class="avatar">☎</div><div class="sms-name">${name}</div><div class="sms-sub">${sub}</div></div>
  <div class="sms-body">${lines.map(([w,x])=>`<div class="bubble ${w==='You'?'me':''}"><span class="spk">${w}</span>${x}</div>`).join('')}</div>
  <div class="call-btns" aria-hidden="true"><i></i><i></i></div></div>`;
const WIN = (barHtml, inner) => `<div class="win"><div class="win-bar"><div class="lights"><i></i><i></i><i></i></div>${barHtml}</div>${inner}</div>`;
const MAIL = (app, {banner='', subj, from, to, body}) => WIN(`<span>${app}</span>`, `${banner}<div class="mail-head"><div class="subj">${subj}</div>
  <div><span class="lbl">From</span>${from}</div><div><span class="lbl">To</span>${to}</div></div><div class="mail-body">${body}</div>`);
const CHAT = (app, head, av, msgs) => WIN(`<span>${app}</span>`, `<div class="chat-head"><div class="avatar">${av}</div><div>${head}</div></div>
  <div class="chat-body">${msgs.map(([w,x])=>`<div class="msg ${w==='You'?'me':''}"><div class="avatar">${w==='You'?'Me':av}</div><div><div class="whoname">${w}</div>${x}</div></div>`).join('')}</div>`);
const WEB = (url, page) => WIN(`<div class="addr">${url}</div>`, `<div class="page">${page}</div>`);
const APP = (app, inner) => WIN(`<span>${app}</span>`, `<div class="page">${inner}</div>`);
const BOOT = `<svg viewBox="0 0 120 100" aria-hidden="true"><path d="M30 10h34l4 40 34 14c8 4 10 10 10 18v6H18l-2-10 8-6z" fill="#8a5a32"/><path d="M16 88h96v8H16z" fill="#2b2b2b"/><path d="M34 22h28M34 32h30M34 42h32" stroke="#e7c9a2" stroke-width="3"/></svg>`;

const CATS = {
  urgency: ['Pressure to act fast', 'Real organizations give you time. A countdown, threat or alarm is your cue to slow down.'],
  sender:  ["Sender doesn't check out", 'Look at the real address, number or profile, not the display name. Strangers and lookalikes are warning signs.'],
  link:    ["Web address doesn't match", 'Read the domain just before the first single slash. Lookalikes add words or misspell the real name.'],
  payment: ['Strange way to pay', 'Gift cards, Zelle, Cash App, crypto, cash couriers or a tiny "fee" are how scammers get paid.'],
  data:    ['Asks for codes, ID, photos or personal details', 'Never share sign-in codes, passwords, ID, photos or account numbers with someone who contacted you.'],
  contact: ['Wants you to call or message them', 'Contact companies using details you find yourself: the back of your card, the official website or app.'],
  toogood: ['Too good to be true', 'Huge discounts, easy money, surprise prizes and instant romance are bait.'],
  secrecy: ['Secrecy or switching apps', '"Keep this between us" or "message me on another app" means they want to avoid anyone checking.'],
};
const KID_CATS = {
  urgency: ['Hurry-up tricks', 'If something says "hurry!", stop and ask a grown-up.'],
  sender:  ['Strangers and pretenders', 'People online can pretend to be anyone, even a kid or the game.'],
  link:    ['Weird links and websites', 'Only get games and updates from the app store, with a grown-up.'],
  data:    ['Asking for passwords, photos or where you live', 'Your password, photos, school and address are private. Keep them that way.'],
  toogood: ['Free stuff that seems too good', 'Free coins, skins and prizes from strangers are tricks.'],
  secrecy: ['Secrets from your grown-ups', 'A safe friend never asks you to keep secrets. Always tell.'],
  payment: ['Asking for money', 'Only grown-ups decide about buying things.'],
  contact: ['Asking you to call', 'Ask a grown-up before contacting anyone.'],
};

/* ---------- Department scenarios (corp) ----------
   GENERAL scenes are shared by every department; who:'f'|'m' picks that department's person.
   screen(t, p) and ctx(p) receive the person: {name, first, last, role, email}. */
const GROUPS = {};
const CO = 'Halvern Industries', DOM = 'halvern.com';
const WORKDAY = ['8:05 AM','8:40 AM','9:25 AM','10:10 AM','11:00 AM','12:15 PM','1:30 PM','2:45 PM','3:50 PM','5:05 PM'];
const person = (first, last, role, blurb) => ({ name:first, first, last, role, blurb, email:`${first.toLowerCase()}.${last.toLowerCase()}@${DOM}` });
const EXT = H('f1',`[EXTERNAL] This message came from outside ${CO}. Be careful with links.`,'banner');
const box = (title, inner) => APP(title, `<div class="kidcard">${inner}</div>`);

const GENERAL = [
  { who:'m', v:'scam', name:'Password phishing email', place:'Work laptop · Outlook',
    ctx: p => `First thing in the morning. ${CO} email addresses end in @${DOM}.`,
    screen: (t,p) => MAIL(`Inbox · ${p.email}`, {banner:EXT, subj:H('n1',`Mailbox password expires today`), from:`IT Service Desk ${H('f2',`&lt;servicedesk@halvern-it-support.com&gt;`)}`, to:p.email,
      body:`${H('f3',`Dear User,`)}<br><br>Your mailbox password ${H('f4',`expires in 2 hours`)}. To keep your current password, verify your account below.<br><br>${H('n2',`Keep My Password`,'btnlink')}<span class="hoverurl">Hover preview: ${H('f5',`https://halvern-login.microsft-verify.com/auth`,'url')}</span>`}),
    f:[['f1','sender',`External sender warning`,`Your IT team emails from inside the company.`],
       ['f2','sender',`Not ${DOM}`,`"halvern-it-support.com" is a different domain anyone could buy.`],
       ['f3','sender',`"Dear User"`,`IT knows your name. A generic greeting means a mass mailing.`],
       ['f4','urgency',`Expires in 2 hours`,`Fear of losing email access is meant to rush you.`],
       ['f5','link',`Misspelled link`,`"microsft-verify.com" is a fake sign-in page that steals passwords.`]],
    do:`Report it with the phishing button. Change passwords only in your normal company sign-in, which you open yourself.` },
  { who:'f', v:'safe', name:'Real IT maintenance notice', place:'Work laptop · Outlook',
    ctx: p => `An all-staff email arrives from IT.`,
    screen: (t,p) => MAIL(`Inbox · ${p.email}`, {subj:'Planned maintenance Saturday night', from:H('f1',`${CO} IT &lt;it@${DOM}&gt;`), to:'All staff',
      body:`Hi everyone,<br><br>${H('f2',`The VPN will be unavailable Saturday from 10 PM to 2 AM for planned maintenance.`)}<br><br>${H('f3',`No action needed.`)} ${H('n1',`Questions: ext. 4400 or the IT portal.`)}`}),
    f:[['f1','ok',`From inside the company`,`@${DOM} and no External banner.`],['f2','ok',`Information only`,`It tells you something. It doesn't ask for anything.`],['f3','ok',`No action needed`,`No link, no password, no deadline.`]],
    do:`Real. Nothing to do.` },
  { who:'f', v:'scam', name:'Shared-file phishing', place:'Work laptop · Outlook',
    ctx: p => `An email says a file has been shared with ${p.first}.`,
    screen: (t,p) => MAIL(`Inbox · ${p.email}`, {banner:EXT, subj:`Q4 Bonus Structure.pdf was shared with you`, from:`HR Documents ${H('f2',`&lt;share@docs-halvern-portal.com&gt;`)}`, to:p.email,
      body:`${H('f3',`Please review the confidential Q4 bonus structure before Friday.`)}<br><br>${H('n1',`Open document`,'btnlink')}<span class="hoverurl">Hover preview: ${H('f4',`https://docs-halvern-portal.com/login?file=q4bonus`,'url')}</span>`}),
    f:[['f1','sender',`External warning`,`HR shares files from inside the company.`],['f2','sender',`Not ${DOM}`,`"docs-halvern-portal.com" is a lookalike.`],
       ['f3','toogood',`A juicy topic`,`Bonus info is bait people can't resist opening.`],['f4','link',`A login page`,`It asks you to sign in on a fake page to "see" the file.`]],
    do:`Don't open it. Report it, and find real HR documents on the intranet yourself.` },
  { who:'m', v:'safe', name:'Real shared file', place:'Work laptop · Outlook',
    ctx: p => `${p.first} asked a teammate, Sam Patel, for the updated schedule this morning.`,
    screen: (t,p) => MAIL(`Inbox · ${p.email}`, {subj:`Schedule v3 was shared with you`, from:H('f1',`Sam Patel &lt;sam.patel@${DOM}&gt;`), to:p.email,
      body:`${H('f2',`Here's the updated schedule you asked for.`)}<br><br>${H('f3',`It's in our team folder.`)} ${H('n1',`Let me know if anything's off.`)}`}),
    f:[['f1','ok',`A coworker on ${DOM}`,`No External banner.`],['f2','ok',`Something you asked for`,`You requested it this morning.`],['f3','ok',`In a folder you know`,`No strange login page.`]],
    do:`Real. Open it from the team folder as usual.` },
  { who:'m', v:'scam', name:'Sign-in approval flood', place:'Phone · Authenticator app',
    ctx: p => `${p.first} is at home on the couch, not signing in to anything.`,
    screen: (t,p) => P(t, 'AU', H('n1',`Authenticator`), 'App notifications', [
      H('f1',`Approve sign-in? Work account · Location: Unknown`), H('f2',`Approve sign-in? (3rd request in 2 minutes)`),
      `<b>Text from +1 (213) 555-0150:</b> ${H('f3',`This is IT. Please tap Approve so the alerts stop.`)}`]),
    f:[['f1','sender',`A sign-in you didn't start`,`Someone has your password and is trying to get in.`],['f2','urgency',`Request after request`,`They hope you'll tap Approve just to make it stop.`],
       ['f3','contact',`"IT" asking you to approve`,`Real IT never asks you to approve a sign-in you didn't make.`]],
    do:`Tap Deny every time, report it to the IT help desk, and change your password.` },
  { who:'f', v:'safe', name:'Real sign-in approval', place:'Work laptop + phone',
    ctx: p => `${p.first} just typed her password into the company sign-in page.`,
    screen: (t,p) => P(t, 'AU', H('f1',`Authenticator`), 'App notification', [H('f2',`Approve sign-in? Work account · Chrome on Windows · Your location`), H('f3',`Enter the number shown on your screen: 47`)]),
    f:[['f1','ok',`Your authenticator app`,`The app your company set up.`],['f2','ok',`Matches what you just did`,`Your laptop, your browser, right now.`],['f3','ok',`Number matching`,`Only someone looking at your screen can approve.`]],
    do:`Real. Approve only sign-ins you just started yourself.` },
  { who:'f', v:'scam', name:'Fake direct deposit change', place:'Work laptop · Outlook',
    ctx: p => `Payday is Friday.`,
    screen: (t,p) => MAIL(`Inbox · ${p.email}`, {banner:EXT, subj:`ACTION REQUIRED: Confirm payroll details before Friday`, from:`Payroll Team ${H('f2',`&lt;payroll@halvern-hr-services.com&gt;`)}`, to:p.email,
      body:`${H('f3',`We're moving to a new payroll system. Confirm your bank details or your paycheck may be delayed.`)}<br><br>${H('f4',`Confirm details`,'btnlink')} ${H('n1',`Takes 2 minutes`)}`}),
    f:[['f1','sender',`External warning`,`Payroll is internal.`],['f2','sender',`A lookalike HR domain`,`Not ${DOM}.`],
       ['f3','urgency',`"Your paycheck may be delayed"`,`Fear about your pay makes you act fast.`],['f4','link',`Enter bank details on a link`,`Your next paycheck would go to the scammer.`]],

      body:`${H('f2',`Reminder: choose your 2027 benefits by November 30.`)}<br><br>${H('f3',`Make your choices in Workday from the intranet home page.`)} ${H('n1',`HR office hours: Tue/Thu 2–4 PM.`)}`}),
    f:[['f1','ok',`Internal HR address`,`No External banner.`],['f2','ok',`A known deadline`,`Weeks away, announced before.`],['f3','ok',`Go there yourself`,`No link to type details into.`]],
    do:`Real. Enroll through the HR system you already use.` },
  { who:'m', v:'scam', name:'Bank impersonation text', place:'Personal phone · texts',
    ctx: p => `${p.first} banks with Coastline Bank. His phone buzzes during a meeting.`,
    screen: (t,p) => P(t, '#', H('n1',`+1 (305) 555-0128`), 'Text message', [
      `Coastline Bank: ${H('f2',`Suspicious sign-in on your account from Lagos, Nigeria.`)} If this was NOT you, ${H('f1',`call our Fraud Team now at 1-877-555-0119`)}.`,
      H('f3',`A specialist will text you a code. Read it back to them to secure your account.`)]),
    f:[['f1','contact',`A number given in the text`,`Call the number on the back of your card instead.`],['f2','urgency',`Scary, specific alert`,`Meant to make you call without thinking.`],
       ['f3','data',`Read back a code`,`That code signs someone into your account.`]],
    do:`Call the number on your card or open your banking app yourself. Never read a code to anyone.` },
  { who:'f', v:'safe', name:'Real sign-in code', place:'Personal phone · texts',
    ctx: p => `${p.first} just tapped Sign in on her Coastline Bank app.`,
    screen: (t,p) => P(t, 'CB', H('f1',`72641`), 'Text message', [`Coastline Bank: ${H('f2',`Your sign-in code is 481 927.`)} ${H('f3',`It expires in 10 minutes.`)} Coastline will never ask for this code.`]),
    f:[['f1','ok',`Short code sender`,`And it arrived right as you signed in.`],['f2','ok',`A code you asked for`,`Type it into the app only.`],['f3','ok',`Short expiry`,`A security feature for a sign-in you started.`]],
    do:`Real. If a code arrives when you didn't sign in, change your password.` },
  { who:'f', v:'scam', name:'Fake delivery text', place:'Personal phone · texts',
    ctx: p => `${p.first} ordered a few things online this week.`,
    screen: (t,p) => P(t, '#', H('f1',`+1 (213) 555-0187`), 'Text message', [`${H('n1',`ParcelPoint:`)} Your package is on hold. ${H('f2',`Update within 24 hrs`)}: ${H('f3',`parcelpoint-redelivery.co/t/48211`,'url')} ${H('f4',`Fee: $1.99`)}`]),
    f:[['f1','sender',`A regular phone number`,`Carriers text from short codes with your real tracking number.`],['f2','urgency',`24-hour deadline`,`Rushing you.`],
       ['f3','link',`Lookalike address`,`Not the carrier's site.`],['f4','payment',`A tiny fee`,`They want your card number.`]],
    do:`Don't tap. Check tracking in the store or carrier app you used.` },
  { who:'m', v:'safe', name:'Real delivery text', place:'Personal phone · texts',
    ctx: p => `${p.first} ordered a desk chair Monday. The order email said tracking ends in 4471.`,
    screen: (t,p) => P(t, 'PP', H('f1',`47201`), 'Text message', [`ParcelPoint: ${H('f2',`Your package (tracking ending 4471) arrives today by 8 PM.`)} ${H('f3',`Track it in the ParcelPoint app.`)}`]),
    f:[['f1','ok',`A short code`,`Not a personal number.`],['f2','ok',`Matches your order`,`Same tracking number.`],['f3','ok',`No link, no fee`,`Points you to the app.`]],
    do:`Real.` },
];

const DEPTS = {
finance: { label:'Finance', tag:'FIN', color:'--c-adults',
  topics:['Vendor bank changes','CEO wire requests','W-2 requests','Fake invoices','Bank callbacks'],
  headline:'Money moves through Finance, so scammers aim here first.',
  intro:'Rachel runs accounts payable and Omar is the controller. Watch for payment changes, urgent wires and requests for sensitive records.',
  people:{ f:person('Rachel','Kim','AP Lead','Processes vendor payments and invoices'), m:person('Omar','Haddad','Controller','Approves wires and runs month-end close') },
  scenes:[
  { who:'m', v:'scam', name:'Vendor bank details change', place:'Work laptop · Outlook', ctx:`Omar approves payments to Freightline Supply, a vendor used for years.`,
    screen: (t,p) => MAIL(`Inbox · ${p.email}`, {banner:EXT, subj:`Updated remittance details`, from:`Freightline Supply Accounts ${H('f2',`&lt;ar@freightline-supply.co&gt;`)}`, to:p.email,

    f:[['f1','sender',`External warning`,`Freightline's real emails come from its known domain.`],['f2','sender',`A slightly different domain`,`".co" instead of ".com".`],

  { who:'f', v:'scam', name:'Help desk MFA reset vishing', place:'Help desk phone · call', ctx:`A caller says she's the CFO.`,

  { who:'m', v:'scam', name:'Fake firewall advisory', place:'Work laptop · Outlook', ctx:`${CO} uses ArcWall firewalls.`,

       ['f3','urgency',`One hour`,`Rushing you past verification.`],['f4','link',`An .exe from email`,`Real patches come from the vendor portal.`]],

  { who:'m', v:'safe', name:'Real vendor advisory', place:'Work laptop · Outlook', ctx:`Kevin subscribed to ArcWall's security notices.`,
    screen: (t,p) => MAIL(`Inbox · ${p.email}`, {banner:H('n1',`[EXTERNAL] This message came from outside ${CO}.`,'banner'), subj:`Security advisory AW-2026-031`, from:H('f1',`ArcWall Security &lt;psirt@arcwall.com&gt;`), to:p.email,
      body:`${H('f2',`A medium-severity issue affects firmware 9.1. Fixed in 9.1.4.`)}<br><br>${H('f3',`Details and downloads are in the ArcWall support portal (login required).`)}`}),
    f:[['f1','ok',`The vendor's real domain`,`A list you subscribed to.`],['f2','ok',`Calm and specific`,`Version numbers, real severity.`],['f3','ok',`Points to the portal`,`No attachment, no direct download.`]],
    do:`Real. Get the fix from the portal and schedule it through change control.` },
  { who:'m', v:'scam', name:'Fake domain renewal', place:'Work laptop · Outlook', ctx:`Kevin manages ${DOM}, which auto-renews each March.`,
    screen: (t,p) => MAIL(`Inbox · ${p.email}`, {banner:EXT, subj:`${DOM} expires in 48 hours`, from:H('f2',`Domain Services &lt;renewals@domain-registry-notice.com&gt;`), to:p.email,
      body:`${H('f3',`Your domain will be released to the public if not renewed in 48 hours.`)} ${H('f4',`Renew for $89`,'btnlink')}`}),
    f:[['f1','sender',`External`,`Not your registrar.`],['f2','sender',`Generic "registry" name`,`A known slamming scam.`],['f3','urgency',`48 hours`,`Wrong too: your domain renews in March.`],['f4','payment',`Pay through their link`,`You'd be transferring or paying a scammer.`]],
    do:`Check expiry in your actual registrar account. Ignore these.` },
  { who:'m', v:'safe', name:'Real domain renewal', place:'Work laptop · Outlook', ctx:`${DOM} auto-renews in March with the company's registrar.`,
    screen: (t,p) => MAIL(`Inbox · ${p.email}`, {subj:`Auto-renewal scheduled for ${DOM}`, from:H('f1',`NameSafe &lt;billing@namesafe.com&gt;`), to:p.email,
      body:`${H('f2',`${DOM} will auto-renew on March 14 using the card on file.`)} ${H('f3',`Manage it in your NameSafe account.`)}`}),
    f:[['f1','ok',`Your actual registrar`,`The account you use.`],['f2','ok',`Right date`,`Matches March renewal.`],['f3','ok',`No link to pay`,`Manage in your account.`]],
    do:`Real.` },
  { who:'f', v:'scam', name:'Admin console phishing', place:'Work laptop · Outlook', ctx:`Aisha has help desk admin rights in the email admin console.`,
    screen: (t,p) => MAIL(`Inbox · ${p.email}`, {banner:EXT, subj:`Unusual admin sign-in detected`, from:H('f2',`Microsoft 365 Admin &lt;admin-alerts@m365-securitycenter.com&gt;`), to:p.email,
      body:`${H('f3',`An unusual admin sign-in was detected. Review it now or admin rights will be suspended.`)}<br><br>${H('f4',`Review activity`,'btnlink')}`}),
    f:[['f1','sender',`External warning`,`Real admin alerts appear in the admin center itself.`],['f2','sender',`Lookalike security domain`,`Not Microsoft's.`],['f3','urgency',`Rights suspended`,`Threat to your access.`],['f4','link',`Review link`,`A fake admin sign-in page.`]],

  { who:'f', v:'safe', name:'Real security alert', place:'Work laptop · security dashboard', ctx:`Aisha keeps the company's endpoint security dashboard open.`,
    screen: () => WEB(H('f1',`https://edr.${DOM}/alerts/88102`,'url'), `<h3>Alert 88102 · Medium</h3><p>${H('f2',`Blocked: unsigned script on LAPTOP-2231 (user: sam.patel)`)}</p><p>${H('f3',`Action taken: quarantined · Assigned to: Help desk`)}</p>`),
    f:[['f1','ok',`Your own security tool`,`Internal dashboard.`],['f2','ok',`Specific details`,`Device, user, what happened.`],['f3','ok',`Already contained`,`Normal triage.`]],

  { who:'m', v:'scam', name:'Malicious "coding test"', place:'Personal laptop · ProNet', ctx:`A recruiter offers Kevin a senior role.`,
    screen: () => CHAT('ProNet · Messaging', H('f1',`<b>Jenna Ross</b> · Talent, Vertex Labs · joined 1 month ago`), 'JR', [['Jenna Ross', H('f2',`Salary $210K, fully remote. Just one quick step.`)], ['Jenna Ross', `${H('f3',`Clone our test repo and run npm install && npm start on your work laptop to show it builds:`)} ${H('f4',`github.com/vertex-labs-hiring/test-app`,'url')}`]]),
    f:[['f1','sender',`New recruiter account`,`Thin history.`],['f2','toogood',`Great offer, little process`,`Bait.`],['f3','data',`Run code on your work laptop`,`Install scripts can steal credentials and keys.`],['f4','link',`An unknown repo`,`Malware disguised as a test.`]],
    do:`Never run unknown code on company devices. Report it to security.` },
  { who:'m', v:'safe', name:'Real change approval', place:'Work laptop · ticket system', ctx:`Kevin submitted a change to patch the file server tonight.`,
    screen: () => WEB(H('f1',`https://helpdesk.${DOM}/changes/CHG-3390`,'url'), `<h3>CHG-3390 · Patch FS01 · Tonight 10 PM</h3><p>${H('f2',`Approved by: IT Manager, Change Board`)}</p><p>${H('f3',`Rollback plan attached · users notified`)}</p>`),
    f:[['f1','ok',`Your change system`,`Internal.`],['f2','ok',`Properly approved`,`Two sign-offs.`],['f3','ok',`Planned`,`Rollback and notice in place.`]],

  ]},

slt: { label:'Senior leadership', tag:'SLT', color:'--c-seniors',
  topics:['Deepfake video calls','Whaling','Fake legal notices','Board impersonation','Fake e-signatures'],
  headline:'Leaders have the authority attackers want to borrow.',
  intro:'Dana is the CFO and Mark is the CEO. Attacks here impersonate executives, boards and lawyers, and they increasingly use AI voice and video.',
  people:{ f:person('Dana','Brooks','CFO','Approves large payments and deals'), m:person('Mark','Ellison','CEO','Public face of the company') },
  scenes:[
  { who:'f', v:'scam', name:'Deepfake video call', place:'Work laptop · video call', ctx:`Dana joins a last-minute call from a link in a text that looked like it came from Mark.`,
    screen: () => box('Video call · external meeting', `<div class="big-emoji">🎥</div><h3>${H('f1',`"Mark Ellison" · camera glitchy, audio slightly out of sync`)}</h3><p>${H('f2',`"Dana, I need you to approve a $1.2M wire for the Harlow deal before close of business."`)}</p><p>${H('f3',`"Keep it between us, the deal isn't public."`)}</p><p class="meta">${H('f4',`Meeting hosted on: secure-meet-call.com`)}</p>`),
    f:[['f1','sender',`Something's off on video`,`AI deepfakes of executives are now used on live calls.`],['f2','payment',`Huge wire by end of day`,`Classic whaling ask.`],['f3','secrecy',`Keep it between us`,`Bypasses approvals.`],['f4','link',`Unknown meeting site`,`Not your company's video tool.`]],
    do:`End the call and call Mark on his known number. Large wires always follow dual approval, no matter who asks.` },
  { who:'f', v:'safe', name:'Real board meeting invite', place:'Work laptop · board portal', ctx:`The quarterly board meeting is next month.`,
    screen: () => WEB(H('f1',`https://boardroom.${DOM}/meetings`,'url'), `<h3>Q4 Board Meeting · December 9</h3><p>${H('f2',`Agenda and pre-reads posted by the board secretary.`)}</p><p>${H('f3',`RSVP in the portal.`)}</p>`),
    f:[['f1','ok',`Your board portal`,`Internal and secured.`],['f2','ok',`Expected meeting`,`On the normal calendar.`],['f3','ok',`Nothing risky asked`,`Just an RSVP.`]],
    do:`Real.` },
  { who:'m', v:'scam', name:'Fake lawsuit notice', place:'Work laptop · Outlook', ctx:`An alarming legal email arrives for Mark.`,
    screen: (t,p) => MAIL(`Inbox · ${p.email}`, {banner:EXT, subj:`NOTICE OF LAWSUIT – response required in 72 hours`, from:H('f2',`Court Notices &lt;filings@us-court-notice.com&gt;`), to:p.email,
      body:`${H('f3',`A complaint has been filed naming you personally. Failure to respond within 72 hours may result in default judgment.`)}<br><br>${H('f4',`View complaint`,'btnlink')}`}),
    f:[['f1','sender',`External warning`,`Courts don't serve lawsuits by random email.`],['f2','sender',`A generic "court" domain`,`Not a real court.`],['f3','urgency',`72-hour threat`,`Fear for you personally.`],['f4','link',`View complaint link`,`Malware or a fake login.`]],
    do:`Forward it to general counsel and IT. Real legal notices come through counsel or a process server.` },
  { who:'m', v:'safe', name:'Real counsel email', place:'Work laptop · Outlook', ctx:`Mark's outside counsel is reviewing a supplier contract.`,
    screen: (t,p) => MAIL(`Inbox · ${p.email}`, {banner:H('n1',`[EXTERNAL] This message came from outside ${CO}.`,'banner'), subj:`Supplier agreement – call Thursday?`, from:H('f1',`Helen Cho &lt;hcho@cho-legal.com&gt;`), to:p.email,
      body:`${H('f2',`I've finished my markup of the Delmar agreement.`)} ${H('f3',`Can we talk Thursday at 2? I'll send the redline through our usual shared folder.`)}`}),
    f:[['f1','ok',`Your known counsel`,`The firm you work with.`],['f2','ok',`Ongoing work`,`A matter you know about.`],['f3','ok',`Usual channel`,`No new links or logins.`]],
    do:`Real.` },
  { who:'m', v:'scam', name:'Fake journalist interview', place:'Work laptop · Outlook', ctx:`A reporter wants to interview Mark.`,
    screen: (t,p) => MAIL(`Inbox · ${p.email}`, {banner:EXT, subj:`Interview request: Industry Leaders 2027`, from:H('f2',`Sarah Lin &lt;sarah.lin.reporter@gmail.com&gt;`), to:p.email,
      body:`${H('f3',`You've been selected for our "Top 50 Industry Leaders" feature.`)} ${H('f4',`Please review the questions and sign in to confirm: industryleaders-media.com/questions`,'url')}`}),
    f:[['f1','sender',`External`,`Media requests go through PR.`],['f2','sender',`A Gmail "reporter"`,`No outlet domain.`],['f3','toogood',`Flattering selection`,`Ego bait for executives.`],['f4','link',`Sign in to see questions`,`A credential trap.`]],
    do:`Send media requests to the PR team to verify.` },
  { who:'f', v:'safe', name:'Real PR request', place:'Work chat', ctx:`The PR team is preparing the year-end announcement.`,
    screen: () => CHAT('Company chat', H('f1',`<b>Nina Alvarez</b> · Communications · ${CO}`), 'NA', [['Nina Alvarez', H('f2',`Hi Dana, could you review the two finance numbers in the press release draft?`)], ['Nina Alvarez', H('f3',`It's in the Comms folder, comments by Friday are fine.`)]]),
    f:[['f1','ok',`Internal colleague`,`Known team.`],['f2','ok',`Normal review`,`Part of your role.`],['f3','ok',`Shared folder, no rush`,`Usual process.`]],
    do:`Real.` },
  { who:'m', v:'scam', name:'Board chair impersonation text', place:'Phone · texts', ctx:`Mark gets a text from a number he doesn't have saved.`,
    screen: (t,p) => P(t, '#', H('f1',`+1 (212) 555-0181`), 'Text message', [`${H('f2',`Mark, it's Robert (board chair). New number.`)} ${H('f3',`Need you on a confidential call about an acquisition in 15 min.`)}`, H('f4',`Don't loop in anyone else yet, especially legal.`)]),
    f:[['f1','sender',`Unknown number`,`Not Robert's saved contact.`],['f2','sender',`"New number"`,`The classic setup line.`],['f3','urgency',`15 minutes`,`Pressure.`],['f4','secrecy',`Don't tell legal`,`Isolating you from people who would stop it.`]],
    do:`Call Robert on his known number. Never exclude legal on deal discussions.` },
  { who:'m', v:'safe', name:'Real board chair email', place:'Work laptop · Outlook', ctx:`The board chair, Robert Hayes, often emails before meetings.`,
    screen: (t,p) => MAIL(`Inbox · ${p.email}`, {subj:`Agenda thoughts for Dec 9`, from:H('f1',`Robert Hayes &lt;robert.hayes@${DOM}&gt;`), to:p.email,
      body:`${H('f2',`Mark, I'd like 20 minutes on the 2027 capex plan at the next meeting.`)} ${H('f3',`Happy to discuss on our usual Friday call.`)}`}),
    f:[['f1','ok',`His board account`,`Known address.`],['f2','ok',`Normal agenda topic`,`Nothing urgent or secret.`],['f3','ok',`Usual call`,`Established routine.`]],
    do:`Real.` },
  { who:'f', v:'scam', name:'Fake NDA e-signature', place:'Work laptop · Outlook', ctx:`An investment banker Dana doesn't know reaches out.`,
    screen: (t,p) => MAIL(`Inbox · ${p.email}`, {banner:EXT, subj:`Please sign: NDA – Project Falcon`, from:H('f2',`SignDocs via Marcus Webb &lt;sign@signdocs-secure.net&gt;`), to:p.email,
      body:`${H('f3',`A buyer is interested in acquiring part of your business. Sign the NDA to receive details.`)}<br><br>${H('f4',`Review &amp; sign`,'btnlink')}`}),
    f:[['f1','sender',`External`,`Unexpected.`],['f2','sender',`Lookalike signing service`,`Not the real SignDocs domain.`],['f3','toogood',`A surprise acquisition interest`,`Tempting for a CFO.`],['f4','link',`Sign link`,`A fake sign-in page.`]],
    do:`Route unsolicited deal approaches through legal. Open signing requests only from known senders.` },
  { who:'f', v:'safe', name:'Real e-signature request', place:'Work laptop · Outlook', ctx:`Legal finished the Polar Air service contract you approved yesterday.`,
    screen: (t,p) => MAIL(`Inbox · ${p.email}`, {subj:`Please sign: Polar Air service agreement`, from:H('f1',`SignDocs on behalf of ${CO} Legal &lt;legal@${DOM}&gt;`), to:p.email,
      body:`${H('f2',`The Polar Air agreement you approved is ready for your signature.`)} ${H('f3',`Sent by Jamie Ortiz, Legal.`)}`}),
    f:[['f1','ok',`From your own legal team`,`Internal sender.`],['f2','ok',`Something you approved`,`Expected.`],['f3','ok',`A named colleague`,`You can confirm in person.`]],
    do:`Real.` },
  ]},
};

DEPTS.hr = { label:'Human resources', tag:'HR', color:'--c-hr',
  topics:['Malware résumés','Payroll diversion','Fake background checks','Fake labor audits','Job board phishing'],
  headline:'HR holds everyone\'s personal data, and opens attachments from strangers all day.',
  intro:'Lauren manages HR operations and Jamal recruits. Scammers send booby-trapped résumés, impersonate employees, and pose as agencies asking for records.',
  people:{ f:person('Lauren','Price','HR Manager','Payroll changes, records and compliance'), m:person('Jamal','Owens','Recruiter','Screens candidates and posts jobs') },
  scenes:[
  { who:'m', v:'scam', name:'Booby-trapped résumé', place:'Work laptop · Outlook', ctx:`Jamal has an open Production Planner role.`,
    screen: (t,p) => MAIL(`Inbox · ${p.email}`, {banner:EXT, subj:`Application – Production Planner (urgent)`, from:H('f2',`Kyle Brennan &lt;kbrennan.jobs@gmail.com&gt;`), to:p.email,
      body:`Hi, ${H('n1',`I'm very interested in the role.`)} ${H('f3',`Please review my résumé today, I have another offer expiring tomorrow.`)}<br><br>${H('f4',`📎 Resume_Kyle_Brennan.zip`)} ${H('f5',`(password: 2026)`)}`}),
    f:[['f1','sender',`Outside the hiring system`,`Real applicants usually apply through your applicant tracking system.`],['f2','sender',`Emailed straight to you`,`Not through the job posting.`],
       ['f3','urgency',`Review it today`,`A competing offer is a pressure tactic.`],['f4','link',`A zipped "résumé"`,`Résumés are PDFs or Word files. Zips hide malware.`],['f5','link',`Password-protected`,`A password stops email scanners from checking it.`]],
    do:`Don't open it. Ask the candidate to apply through the careers page, and report the email.` },
  { who:'m', v:'safe', name:'Real application', place:'Work laptop · applicant tracking system', ctx:`Jamal is reviewing applicants for the Production Planner role.`,
    screen: () => WEB(H('f1',`https://careers.${DOM}/ats/req-2214`,'url'), `<h3>New applicant · Production Planner</h3><p>${H('f2',`Priya Shah · résumé.pdf (scanned ✓)`)}</p><p>${H('f3',`Applied via careers page · 2 hours ago`)}</p>`),
    f:[['f1','ok',`Your applicant system`,`Where applications belong.`],['f2','ok',`A scanned PDF`,`The system already checked the file.`],['f3','ok',`Normal channel`,`Came through the careers page.`]],
    do:`Real. Review it in the system.` },
  { who:'f', v:'scam', name:'Payroll diversion request', place:'Work laptop · Outlook', ctx:`Sam Patel works in Sales. Payday is Friday.`,
    screen: (t,p) => MAIL(`Inbox · ${p.email}`, {banner:EXT, subj:`Change my direct deposit`, from:H('f2',`Sam Patel &lt;sam.patel.home@gmail.com&gt;`), to:p.email,
      body:`Hi Lauren, ${H('f3',`I switched banks. Can you update my direct deposit to the account below before Friday's payroll?`)} ${H('f4',`I can't log in to the HR system from my phone right now.`)}`}),
    f:[['f1','sender',`External`,`Employees email HR from work accounts.`],['f2','sender',`A personal Gmail`,`Anyone can make an address with Sam's name.`],
       ['f3','payment',`New bank before payday`,`The paycheck would go to a scammer.`],['f4','secrecy',`Avoids the HR system`,`The system checks identity. Email doesn't.`]],
    do:`Never change pay details by email. Ask Sam to update it himself in the HR system, or confirm in person.` },
  { who:'f', v:'safe', name:'Real self-service bank change', place:'Work laptop · HR system', ctx:`Lauren reviews HR system notifications each morning.`,
    screen: () => WEB(H('f1',`https://hr.${DOM}/notifications`,'url'), `<h3>Direct deposit updated · Sam Patel</h3><p>${H('f2',`Changed by the employee in self-service after MFA sign-in`)}</p><p>${H('f3',`Confirmation email sent to Sam's work address`)}</p>`),
    f:[['f1','ok',`Your HR system`,`Internal.`],['f2','ok',`Done by the employee`,`Verified with MFA.`],['f3','ok',`Employee is notified`,`Sam would spot a change he didn't make.`]],
    do:`Real. No action needed.` },
  { who:'f', v:'scam', name:'Fake background check vendor', place:'Work laptop · Outlook', ctx:`${CO} uses ClearPath Screening for background checks.`,
    screen: (t,p) => MAIL(`Inbox · ${p.email}`, {banner:EXT, subj:`Action needed: re-verify new hire SSNs`, from:H('f2',`ClearPath Compliance &lt;verify@clearpath-screening-us.com&gt;`), to:p.email,
      body:`${H('f3',`Due to a system migration, please re-upload SSNs and birth dates for all new hires this quarter.`)}<br><br>${H('f4',`Upload securely`,'btnlink')} ${H('n1',`ClearPath Support`)}`}),
    f:[['f1','sender',`External`,`Check it against your known vendor.`],['f2','sender',`Lookalike vendor domain`,`Not ClearPath's real domain.`],
       ['f3','data',`Bulk SSNs and birth dates`,`A goldmine for identity theft.`],['f4','link',`Upload link`,`Sends data to the scammer.`]],
    do:`Contact ClearPath through your existing portal or account manager. Never send SSNs through an email link.` },
  { who:'f', v:'safe', name:'Real background check portal', place:'Work laptop · ClearPath portal', ctx:`A candidate accepted an offer yesterday.`,
    screen: () => WEB(H('f1',`https://portal.clearpathscreening.com/orders`,'url'), `<h3>Order #CP-44812 · Priya Shah</h3><p>${H('f2',`Candidate consent received · check in progress`)}</p><p>${H('f3',`Estimated completion: 3 business days`)}</p>`),
    f:[['f1','ok',`Your vendor's real portal`,`Bookmarked and signed in.`],['f2','ok',`Candidate consented`,`Through the proper process.`],['f3','ok',`Normal status`,`Nothing for you to send.`]],
    do:`Real.` },
  { who:'f', v:'scam', name:'Fake labor audit', place:'Work laptop · Outlook', ctx:`An official-looking email lands in Lauren's inbox.`,

      body:`${H('f3',`Your company has been selected for a payroll audit. Submit all employee records within 48 hours to avoid penalties up to $50,000.`)}<br><br>${H('f4',`Submit records`,'btnlink')}`}),
    f:[['f1','sender',`External`,`Government agencies use .gov domains.`],['f2','sender',`A .org posing as government`,`Sounds official, isn't.`],
       ['f3','urgency',`48 hours and a big fine`,`Fear to skip checking with legal.`],['f4','data',`All employee records via a link`,`Real audits go through legal and formal letters.`]],
    do:`Forward it to legal. Look up the agency's real contact details yourself before responding to any audit.` },
  { who:'m', v:'safe', name:'Real hiring manager request', place:'Work chat', ctx:`Jamal supports the plant's hiring.`,
    screen: () => CHAT('Company chat', H('f1',`<b>Maria Lopez</b> · Plant Supervisor · ${CO}`), 'ML', [['Maria Lopez', H('f2',`Hi Jamal, can we set up interviews for the 3 planner finalists next week?`)], ['Maria Lopez', H('f3',`Tue or Wed afternoons work best for me.`)]]),
    f:[['f1','ok',`An internal colleague`,`A hiring manager you support.`],['f2','ok',`Normal recruiting work`,`Scheduling interviews.`],['f3','ok',`Nothing sensitive`,`No data, no links.`]],
    do:`Real.` },
  { who:'m', v:'scam', name:'Job board phishing', place:'Work laptop · Outlook', ctx:`Jamal posts jobs on HireHub.`,
    screen: (t,p) => MAIL(`Inbox · ${p.email}`, {banner:EXT, subj:`Your job posting has been suspended`, from:H('f2',`HireHub Trust &amp; Safety &lt;support@hirehub-employer-verify.com&gt;`), to:p.email,
      body:`${H('f3',`Your Production Planner listing was suspended for a policy violation. Verify your employer account within 24 hours to restore it.`)}<br><br>${H('f4',`Verify account`,'btnlink')}`}),
    f:[['f1','sender',`External warning`,`Check every account notice's source.`],['f2','sender',`A lookalike support domain`,`Not hirehub.com.`],
       ['f3','urgency',`24 hours to restore`,`Fear of losing applicants.`],['f4','link',`Verify link`,`A fake login to steal your employer account and post fake jobs.`]],
    do:`Log in to HireHub from your bookmark to check your listing. Report the email.` },
  { who:'m', v:'safe', name:'Real job board notice', place:'Work laptop · Outlook', ctx:`Jamal posted a new Maintenance Tech role on HireHub this morning.`,

function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function buildDeck(g){
  /* 10 moments: 6 from the department's own pool + 4 from the general workplace pool,
     shuffled, with 4–6 scams so players can't count on a fixed mix. */
  let all = [];
  for(let tries=0; tries<300; tries++){
    all = [...shuffle(g.scenes).slice(0,6), ...shuffle(g.general||[]).slice(0,4)];
    const sc = all.filter(s=>s.v==='scam').length;
    if(sc>=4 && sc<=6) break;
  }
  return shuffle(all).map((s,k)=>({...s, t:g.times[k]}));
}

function renderScene(g){
  const s = S(g)[state.i], flags = fl(s), r = state.results[state.i], reveal = state.phase==='reveal';
  const p = g.people[s.who];

  } else {

    const items = flags.map((f,k)=>{
      const got = r.foundIds.includes(f.id);

      return `<li class="${!f.ok && !got ? 'missed-row' : ''}"><span class="num ${f.ok||got?'got':''}">${k+1}</span><div><b>${f.label}${st}</b><p>${f.why}</p></div></li>`;
    }).join('');
    const next = state.i < S(g).length-1 ? `Next: ${S(g)[state.i+1].t}` : 'See your report';
    const msg = r.correct ? (isScam ? (g.kid?'Yes! That was a trick.':'Right, this is a scam.') : (g.kid?'Yes! This one is OK.':'Right, this one is real.'))
                          : (isScam ? (g.kid?'Oops, that was a trick.':'Not quite. This is a scam.') : (g.kid?'This one was actually OK.':'Not quite. This one is real.'));

      ${isScam ? `<p class="hint">You spotted ${r.found} of ${r.total} red flags.</p>` : `<p class="hint">Why it checks out:</p>`}
      ${isScam && missedN ? `<div class="missbox">You missed ${missedN}. ${missedN>1?'They are':'It is'} marked MISSED in red on the screen.</div>` : ''}

    legend = isScam
      ? `<div class="legend"><span><i class="lg-got"></i>You spotted it</span><span><i class="lg-miss"></i>You missed it</span><span><i class="lg-false"></i>Not a red flag</span></div>`

    });
  }
}

/* ---------- Completion report ---------- */
function buildRun(g){
  const rs = state.results, C = cats(g);
  const by = {};
  const scenes = S(g).map((s,k)=>{
    const r = rs[k], bad = fl(s).filter(f=>!f.ok);
    bad.forEach(f=>{ by[f.cat] ??= {hit:0,all:0}; by[f.cat].all++; if(r.foundIds.includes(f.id)) by[f.cat].hit++; });
    return { t:s.t, name:s.name, who:g.people[s.who].name, v:s.v, call:r.call, correct:r.correct, found:r.found, total:r.total, falseAlarms:r.falseAlarms,
      missed: bad.filter(f=>!r.foundIds.includes(f.id)).map(f=>f.label) };
  });
  const sorted = Object.entries(by).sort((a,b)=>(a[1].hit/a[1].all)-(b[1].hit/b[1].all));
  const total = scenes.reduce((a,x)=>a+x.total,0);
  return {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), at: Date.now(),
    group: state.g, groupLabel: g.label, name: playerName, team: playerTeam, rid: ASSIGN ? ASSIGN.rid : '',
    score: score(), max: S(g).length*10 + total*5,
    correct: scenes.filter(x=>x.correct).length, of: scenes.length,
    scams: scenes.filter(x=>x.v==='scam').length, reals: scenes.filter(x=>x.v==='safe').length,
    scamsCaught: scenes.filter(x=>x.v==='scam'&&x.correct).length, realTrusted: scenes.filter(x=>x.v==='safe'&&x.correct).length,
    found: scenes.reduce((a,x)=>a+x.found,0), total, falseAlarms: scenes.reduce((a,x)=>a+x.falseAlarms,0),
    blindSpot: sorted[0] && sorted[0][1].hit < sorted[0][1].all ? C[sorted[0][0]][0] : '',
    byCat: sorted.map(([c,v])=>({cat:c, label:C[c][0], tip:C[c][1], hit:v.hit, all:v.all})),
    scenes
  };
}

async function persist(run){

  if(!CAP.db || !CAP.uid){ state.saveStatus = 'local'; updateSaveNote(); return; }
  state.saveStatus = 'saving'; updateSaveNote();
  const ref = CAP.db.doc('completions/' + CAP.uid);
  try{
    const snap = await ref.get();
    const runs = snap.exists && Array.isArray(snap.data().runs) ? snap.data().runs.slice() : [];
    if(!runs.some(x=>x.id===run.id)) runs.push(run);
    await ref.set({ uid: CAP.uid, updated: Date.now(), runs: runs.slice(-40) });
    state.saveStatus = 'saved';
  }catch(e){ state.saveStatus = 'failed'; }
  updateSaveNote();
}

/* ---------- Roster: personal links for each person ---------- */
const GROUP_ALIASES = { 'finance':'finance', 'accounting':'finance', 'ap':'finance', 'accounts payable':'finance', 'payroll':'finance', 'treasury':'finance',
  'sales':'sales', 'business development':'sales', 'account management':'sales',
  'manufacturing':'manufacturing', 'production':'manufacturing', 'plant':'manufacturing', 'operations':'manufacturing', 'maintenance':'manufacturing', 'mfg':'manufacturing',
  'it':'it', 'information technology':'it', 'help desk':'it', 'helpdesk':'it', 'infrastructure':'it',
  'hr':'hr', 'human resources':'hr', 'people':'hr', 'people ops':'hr', 'recruiting':'hr', 'talent':'hr', 'talent acquisition':'hr',
  'rd':'rd', 'r&d':'rd', 'design':'rd', 'product development':'rd', 'new product development':'rd', 'npd':'rd', 'engineering':'rd', 'product':'rd', 'design & product development':'rd',
  'slt':'slt', 'senior leadership':'slt', 'senior leadership team':'slt', 'leadership':'slt', 'executive':'slt', 'executives':'slt', 'exec':'slt' };
const slug = s => String(s||'').toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,24);

function parseCSV(text){
  text = String(text||'').replace(/^﻿/,'');
  const first = text.split(/\r?\n/)[0] || '';
  const sep = first.includes('\t') ? '\t' : ',';
  const rows = []; let row = [], cur = '', q = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=c; }
    else if(c==='"') q = true;
    else if(c===sep){ row.push(cur); cur=''; }
    else if(c==='\n' || c==='\r'){ if(c==='\r' && text[i+1]==='\n') i++; row.push(cur); rows.push(row); row=[]; cur=''; }
    else cur += c;
  }
  if(cur!=='' || row.length){ row.push(cur); rows.push(row); }
  return rows.map(r=>r.map(x=>x.trim())).filter(r=>r.some(x=>x));
}

function draftFrom(text, existing){
  const rows = parseCSV(text);
  if(!rows.length) return {entries:[], errors:['The list is empty.']};
  const h = rows[0].map(x=>x.toLowerCase());
  const hasHeader = h.some(x=>/name|team/.test(x));
  const col = (re, d) => { const i = h.findIndex(x=>re.test(x)); return hasHeader ? i : d; };
  const ci = { name: col(/name/,0), team: col(/team/,1), group: col(/dep|age|group/,2), email: col(/mail/,3) };
  const used = new Set((existing||[]).map(p=>p.rid));
  const entries = [], errors = [];
  rows.slice(hasHeader?1:0).forEach((r,k)=>{
    const name = (r[ci.name]||'').slice(0,60), team = (ci.team>=0 ? r[ci.team]||'' : '').slice(0,60);
    const gRaw = (ci.group>=0 ? r[ci.group]||'' : '').toLowerCase().trim();
    const tRaw = (ci.team>=0 ? r[ci.team]||'' : '').toLowerCase().trim();
    const group = GROUPS[GROUP_ALIASES[gRaw]] ? GROUP_ALIASES[gRaw] : (GROUPS[GROUP_ALIASES[tRaw]] ? GROUP_ALIASES[tRaw] : '');
    const email = (ci.email>=0 ? r[ci.email]||'' : '').slice(0,120);
    if(!name){ errors.push(`Row ${k+(hasHeader?2:1)}: no name, skipped.`); return; }
    if(gRaw && !group) errors.push(`Row ${k+(hasHeader?2:1)}: department "${r[ci.group]}" not recognized, so ${name} will pick their own.`);
    let base = (slug(name) + (team ? '-' + slug(team) : '')) || 'person', rid = base, n = 2;
    while(used.has(rid)) rid = `${base}-${n++}`;
    used.add(rid);
    entries.push({rid, name, team, group, email});
  });
  if(entries.length > 1000){ errors.push('Only the first 1,000 people were kept.'); entries.length = 1000; }
  return {entries, errors};
}
